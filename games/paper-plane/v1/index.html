// ---------- 音频 ----------
let AC = null, master = null, muted = false;
function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.2; master.connect(AC.destination);
    } catch (err) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noiseHit(dur, vol, fc, type) {
  if (!AC || muted) return;
  const t = AC.currentTime, len = Math.max(1, (dur * AC.sampleRate) | 0);
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = fc;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const sfx = {
  launch() { noiseHit(0.2, 0.35, 1800, 'bandpass'); tone(300, 700, 0.2, 'sine', 0.15); },
  deliver() { tone(880, 1320, 0.12, 'sine', 0.6); tone(1320, 1760, 0.1, 'sine', 0.3, 0.08); },
  miss() { tone(300, 200, 0.2, 'square', 0.3); },
  crash() { noiseHit(0.25, 0.5, 600); tone(180, 60, 0.2, 'triangle', 0.4); },
  stall() { tone(520, 340, 0.12, 'triangle', 0.4); tone(560, 300, 0.14, 'triangle', 0.4, 0.12); },

  updraft() { tone(440, 880, 0.35, 'sine', 0.3); },

  lose() { tone(392, 196, 0.6, 'sawtooth', 0.25); },
};

// ---------- 随机（只用于炊烟和飞鸟的装饰） ----------
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;
// 窗户亮灯、衣服颜色等固定装饰用哈希，不占用 rng。
function hash(a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }

// ---------- 模型（纯函数，120 Hz 定步） ----------
function buildCourse(src) {
  const b = []; let x = -200;
  for (const [w, h, gap = 40] of src.row) { b.push({ x, w, h }); x += w + gap; }
  const mid = i => b[i].x + b[i].w / 2, last = b[b.length - 1];
  const c = {
    name: src.name, medals: src.medals, cap: src.cap, src,
    b, start: { x: mid(0), y: b[0].h + 80 }, finish: last.x + 40,
    t: src.t.at.map(i => ({ x: mid(i), w: src.t.width, roof: b[i].h, top: b[i].h + (src.t.riseAt[i] ?? src.t.rise), lift: src.t.lift, bi: i })),
    m: src.m.map(i => ({ x: mid(i), roof: b[i].h, bi: i })),
    c: src.c.map(i => ({ x: mid(i), y: b[i].h + 150, bi: i })),
    w: src.w, l: src.l, z: src.z,
  };
  // 电线两端高过屋顶的地方立一根杆子，从屋顶（或地面）到线端。
  c.poles = src.w.flatMap(([x1, y1, x2, y2]) => [[x1, y1], [x2, y2]])
    .map(([px, py]) => ({ x: px, roof: roofAt(c, px), top: py })).filter(p => p.top > p.roof);
  return c;
}
function roofAt(course, x) {
  for (const b of course.b) if (x >= b.x && x <= b.x + b.w) return b.h;
  return 0;
}
function newRun(course) {
  return {
    course, x: course.start.x, y: course.start.y, th: 0, v: LAUNCH_V, stalled: false, t: 0, pen: 0,
    state: 'fly', pause: 0, cp: course.start, cpi: -1, mail: course.m.map(() => null),
    crashes: 0, misses: 0, delivered: 0, rise: 0, done: false,
  };
}
function approach(a, target, rate) {
  return a < target ? Math.min(target, a + rate * DT) : Math.max(target, a - rate * DT);
}
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const u = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(px - x1 - u * dx, py - y1 - u * dy);
}
// mg 是录制时用的安全余量（正常游戏为 0）。
function hits(run, mg = 0) {
  const c = run.course, x = run.x, y = run.y, r = R + mg;
  if (y <= r) return true;
  for (const b of c.b) if (x + r > b.x && x - r < b.x + b.w && y - r < b.h) return true;
  for (const t of c.t) if (Math.abs(x - t.x) < 12 + r && y - r < t.roof + 36) return true;
  for (const w of c.w) if (segDist(x, y, ...w) < r + 2) return true;
  for (const p of c.poles) if (Math.abs(x - p.x) < r + 2 && y > p.roof && y - r - 2 < p.top) return true;
  for (const [lx, ly] of c.l) if (Math.hypot(x - lx, y - ly) < r + 16) return true;
  return false;
}
function stepRun(run, hold, mg = 0) {
  const ev = [], c = run.course;
  run.t += DT;
  if (run.state === 'crash') {   // 撞毁停顿时时钟照走
    run.rise = 0;
    if ((run.pause -= DT) <= 0) {
      Object.assign(run, { x: run.cp.x, y: run.cp.y, th: 0, v: RESPAWN_V, stalled: false, state: 'fly' });
      ev.push({ e: 'respawn' });
    }
    return ev;
  }
  const st = run.stalled;
  run.th = approach(run.th, st ? STALL_TARGET : hold ? UP_TARGET : DOWN_TARGET, st ? STALL_RATE : hold ? UP_RATE : DOWN_RATE);
  run.v += (-G * Math.sin(run.th) - DRAG * run.v * run.v) * DT;
  run.v = Math.min(run.v, V_MAX);
  if (!run.stalled && run.v < V_STALL) { run.stalled = true; ev.push({ e: 'stall' }); }
  if (run.stalled && run.v >= V_RECOVER) run.stalled = false;
  run.v = Math.max(run.v, 40);
  let fyT = 0, fx = 0, fy = 0;
  for (const t of c.t) if (Math.abs(run.x - t.x) <= t.w / 2 && run.y >= t.roof && run.y <= t.top) fyT += t.lift;
  fy = fyT;
  for (const [x0, x1, y0, y1, wx, wy] of c.z)
    if (run.x >= x0 && run.x <= x1 && run.y >= y0 && run.y <= y1) { fx += wx; fy += wy; }
  const before = run.rise;
  run.rise = fyT > 0 ? run.rise + fyT * DT : 0;
  if (before < 300 && run.rise >= 300) ev.push({ e: 'updraft' });
  run.x += (run.v * Math.cos(run.th) + fx) * DT;
  run.y = Math.min(CEIL, run.y + (run.v * Math.sin(run.th) + fy) * DT);
  c.m.forEach((m, i) => {
    if (run.mail[i] !== null) return;
    if (Math.abs(run.x - m.x) <= 50 - mg && run.y >= m.roof + 20 + mg && run.y <= m.roof + 160 - mg) {
      run.mail[i] = true; run.delivered++; ev.push({ e: 'deliver', i });
    } else if (run.x > m.x + 50) {
      run.mail[i] = false; run.pen += MISS_PEN; run.misses++; ev.push({ e: 'miss', i });
    }
  });
  c.c.forEach((cp, i) => { if (i > run.cpi && run.x >= cp.x) { run.cpi = i; run.cp = cp; ev.push({ e: 'checkpoint', i }); } });
  if (hits(run, mg)) {
    Object.assign(run, { state: 'crash', pause: CRASH_PAUSE });
    run.pen += CRASH_PEN; run.crashes++;
    ev.push({ e: 'crash' });
    return ev;
  }
  if (run.x >= c.finish) { run.done = true; ev.push({ e: 'finish' }); }
  return ev;
}
function routeTime(run) { return run.t + run.pen; }
function medalFor(route, time) {
  const [g, s, b] = COURSES[route].medals;
  return time <= g ? 'gold' : time <= s ? 'silver' : time <= b ? 'bronze' : null;
}
function decodeScript(hex) {
  return [...hex].flatMap(h => { const v = parseInt(h, 16); return [8, 4, 2, 1].map(b => (v & b) ? 1 : 0); });
}
const COURSES = COURSE_SRC.map(buildCourse);

// ---------- 状态 ----------
let screen = 'start', route = 0, run = null, results = [], letters = 0, inRound = false;
let acc = 0, lockT = 0, T = 0, tickN = 0, camX = 0, camY = 0, shake = 0, stampT = 0;
let trail = [], parts = [], floats = [];
const pointers = new Set();
let spaceDown = false;
function holding() { return spaceDown || pointers.size > 0; }
function course() { return COURSES[route]; }
function camTarget() { return Math.max(0, Math.min(460, run.y - 220)); }

function startRound() {
  route = 0; results = []; letters = 0; inRound = false;
  roundAchievements = new Set();
  showIntro();
}
function showIntro() {
  screen = 'intro'; run = newRun(course()); camY = camTarget();
  trail = []; parts = []; floats = [];
}
function launch() {
  run = newRun(course()); screen = 'fly'; acc = 0; tickN = 0; camY = camTarget();
  trail = []; floats = [];
  sfx.launch();
  if (!inRound) { inRound = true; emitMoYuFunEvent('start'); }
}
function float(text, color, size) { floats.push({ x: run.x, y: run.y + 26, text, color, size: size || 18, t: 0 }); }
function burst(x, y, n, colors, speed, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + speed * 0.3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14,
      t: 0, life: life * (0.6 + Math.random() * 0.4), color: colors[i % colors.length], size: 3 + Math.random() * 5 });
  }
}
function tick(hold) {
  if (screen !== 'fly') return;
  const evs = stepRun(run, hold);
  if (++tickN % 3 === 0 && run.state === 'fly') { trail.push({ x: run.x, y: run.y }); if (trail.length > 40) trail.shift(); }
  for (const ev of evs) {
    if (ev.e === 'stall') sfx.stall();
    else if (ev.e === 'updraft') {
      if (!roundAchievements.has('updraft')) float('扶摇直上！', '#ffffff', 20);
      unlockAchievement('updraft'); sfx.updraft();
    } else if (ev.e === 'deliver') {
      letters++; sfx.deliver(); float('送达！', '#2e9e5b', 20);
      const m = course().m[ev.i];
      parts.push({ env: true, x0: run.x, y0: run.y, x1: m.x, y1: m.roof + 22, t: 0, life: 0.45 });
    } else if (ev.e === 'miss') { sfx.miss(); float('+5 秒 漏信', RED); }
    else if (ev.e === 'checkpoint') { sfx.checkpoint(); float('检查点', '#f2b134'); }
    else if (ev.e === 'crash') {
      sfx.crash(); float('+3 秒 撞毁', RED); shake = 10; trail = [];
      burst(run.x, run.y, 22, [PAPER, '#e8e1cf', '#d9d2bf', RED], 260, 0.9);
    } else if (ev.e === 'respawn') { camY = camTarget(); trail = []; burst(run.x, run.y, 10, ['#ffffff', PAPER], 90, 0.4); }
  }
  if (run.done) finishRoute();
  else if (routeTime(run) >= course().cap) endRound(false);
}
function update(dt) {
  T += dt; lockT -= dt; stampT += dt;
  shake = Math.max(0, shake - dt * 30);
  if (screen === 'fly') {
    acc += Math.min(dt, 0.25);
    while (acc >= DT && screen === 'fly') { acc -= DT; tick(holding()); }
  }
  if (run && (screen === 'fly' || screen === 'intro')) camY += (camTarget() - camY) * (1 - Math.exp(-5 * dt));
  for (const p of parts) {
    p.t += dt;
    if (!p.env) { p.vy -= 420 * dt; p.vx *= 1 - dt * 1.5; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  }
  parts = parts.filter(p => p.t < p.life);
  for (const f of floats) { f.t += dt; f.y += 40 * dt; }
  floats = floats.filter(f => f.t < 1.3);
}
function finishRoute() {
  const time = routeTime(run), medal = medalFor(route, time);
  results.push({ time, medal, delivered: run.delivered, crashes: run.crashes, misses: run.misses, flight: run.t });
  if (run.misses === 0) unlockAchievement('deliver_all');
  if (medal === 'gold') unlockAchievement('gold');
  stampT = 0; sfx.stamp();
  burst(run.x, run.y, 26, ['#f2b134', RED, '#ffffff', '#6fc2ff'], 320, 1.1);
  if (route === 2) {
    if (results.every(r => r.medal === 'gold')) unlockAchievement('all_gold');
    if (results.every(r => r.crashes === 0)) unlockAchievement('flawless');
    endRound(true);
  } else { screen = 'routeDone'; lockT = 0.5; }
}
function nextRoute() { route++; showIntro(); }
function endRound(won) {

  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(x, y + 6, w, h, 18);
  ctx.fillStyle = '#fffaf0'; rr(x, y, w, h, 18);
  ctx.strokeStyle = 'rgba(226,92,60,.35)'; ctx.lineWidth = 2; ctx.setLineDash([10, 6]);
  ctx.beginPath(); ctx.roundRect(x + 8, y + 8, w - 16, h - 16, 12); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
}
function stamp(medal, x, y, r, k) {
  const e = easeOutBack(Math.min(1, k / 0.35)), s = 2.2 - 1.2 * e;
  if (k < 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.22); ctx.scale(s, s); ctx.globalAlpha = Math.min(1, k * 4);
  if (!medal) { text('没有邮戳', 0, 0, 20, '#9a8f80', 800); ctx.restore(); return; }
  const [name, col] = MEDAL[medal];
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, r - 7, 0, 7); ctx.stroke();
  text(name, 0, -4, r * 0.7, col, 900);
  text('邮戳', 0, r * 0.45, r * 0.26, col, 800);
  ctx.restore();
}

function draw() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#151a24'; ctx.fillRect(0, 0, view.w, view.h);
  ctx.setTransform(view.s * view.dpr, 0, 0, view.s * view.dpr, view.ox * view.dpr, view.oy * view.dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  if (screen === 'start') {
    const c = COURSES[0];
    camX = 400 + (T * 90) % (c.finish - 1600); camY = 60;
    drawWorld(c);
    ctx.fillStyle = 'rgba(21,26,36,.35)'; ctx.fillRect(0, 0, W, H);
    card(250, 70, 460, 410, 1);
    ctx.save(); ctx.translate(480, 126); ctx.rotate(Math.sin(T * 2) * 0.08);
    ctx.fillStyle = PAPER; ctx.strokeStyle = '#3b3a4a'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(-26, -20); ctx.lineTo(-14, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d8d2c2'; ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(-24, 16); ctx.lineTo(-12, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    text('纸飞机邮差', 480, 190, 50, INK, 900);
    text('按住上扬，松开俯冲，把信送到每个邮筒', 480, 238, 17, '#7a6a55', 500);
    COURSES.forEach((cc, i) => {
      ctx.fillStyle = 'rgba(226,92,60,.08)'; rr(310, 268 + i * 40, 340, 32, 8);
      text(`第 ${i + 1} 程 · ${cc.name}`, 326, 284 + i * 40, 16, INK, 700, 'left');
      text(`金 ${cc.medals[0].toFixed(1)} 秒`, 634, 284 + i * 40, 15, '#c48a12', 800, 'right');
    });
    text('按住鼠标 / 触摸 / 空格上扬 · R 重来 · M 静音', 480, 462, 13, '#9a8a72', 500);
    if (view.h > view.w) outlined('横过来更好玩', 480, 510, 18, '#ffffff');
  } else {
    const c = course();
    camX = run.x - 280;
    const sh = shake > 0 ? [(Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake] : [0, 0];
    ctx.save(); ctx.translate(sh[0], sh[1]);
    drawWorld(c); drawPlane(); drawParts();
    ctx.restore();
    if (c.src.night) { ctx.fillStyle = 'rgba(10,8,30,.12)'; ctx.fillRect(0, 0, W, H); }
    drawHud();

    if (screen === 'intro') {
      ctx.fillStyle = 'rgba(21,26,36,.3)'; ctx.fillRect(0, 0, W, H);
      const [g, s, b] = c.medals;
      outlined(`第 ${route + 1} 程 · ${c.name}`, 480, 200, 40, '#ffffff');
      outlined(`金 ${g.toFixed(1)} 秒 · 银 ${s.toFixed(1)} · 铜 ${b.toFixed(1)}`, 480, 248, 20, '#ffe08a');
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4);
      outlined('按住任意处起飞', 480, 330, 24, '#ffffff');
      ctx.globalAlpha = 1;
      if (route === 0) outlined('钻进炊烟被托高 · 穿过虚线框送信 · 太慢会失速', 480, 372, 15, '#ffffff');
    } else if (screen === 'routeDone') {
      const r = results.at(-1), k = Math.min(1, (0.5 - lockT) / 0.3);
      ctx.fillStyle = `rgba(21,26,36,${0.4 * k})`; ctx.fillRect(0, 0, W, H);
      card(270, 110, 420, 350, k);
      ctx.globalAlpha = Math.min(1, k * 2);
      text('送达！', 400, 165, 34, INK, 900);
      text(`${r.time.toFixed(1)} 秒`, 400, 220, 40, RED, 900);
      text(r.medal ? `${MEDAL[r.medal][0]}邮戳` : '没有邮戳', 400, 262, 16, '#7a6a55', 700);
      text(`飞行 ${r.flight.toFixed(1)} 秒 · 漏信 ${r.misses} × 5 · 撞毁 ${r.crashes} × 3`, 480, 312, 15, '#7a6a55', 500);
      text(`✉ ${r.delivered}/${c.m.length}`, 480, 345, 16, INK, 700);
      ctx.globalAlpha = 1;
      stamp(r.medal, 580, 210, 52, stampT - 0.15);
    } else if (screen === 'won' || screen === 'lost') {
      const k = Math.min(1, (0.5 - lockT) / 0.3);
      ctx.fillStyle = `rgba(21,26,36,${0.45 * k})`; ctx.fillRect(0, 0, W, H);
      if (screen === 'won') {
        card(250, 70, 460, 420, k);
        ctx.globalAlpha = Math.min(1, k * 2);
        text('今日邮件全部送达', 480, 124, 30, INK, 900);
        results.forEach((r, i) => {
          const y = 182 + i * 56;
          ctx.fillStyle = 'rgba(226,92,60,.07)'; rr(300, y - 22, 360, 44, 10);
          text(`第 ${i + 1} 程 · ${COURSES[i].name}`, 318, y, 16, INK, 700, 'left');
          text(`${r.time.toFixed(1)} 秒`, 560, y, 18, INK, 800, 'right');
          if (r.medal) { ctx.fillStyle = MEDAL[r.medal][1]; ctx.beginPath(); ctx.arc(620, y, 15, 0, 7); ctx.fill(); text(MEDAL[r.medal][0], 620, y, 15, '#fff', 900); }
          else text('—', 620, y, 16, '#9a8f80', 700);
        });
        const total = results.reduce((s, r) => s + r.time, 0);
        text(`合计 ${total.toFixed(1)} 秒 · 送达 ${letters} 封`, 480, 372, 17, '#7a6a55', 700);
        ctx.globalAlpha = 1;
      } else {
        card(270, 140, 420, 280, k);
        ctx.globalAlpha = Math.min(1, k * 2);
        emoji('🌙', 480, 198, 40);
        text('天黑了，信还没送完', 480, 252, 28, INK, 900);
        text(`第 ${route + 1} 程超过 ${course().cap.toFixed(1)} 秒`, 480, 292, 16, '#7a6a55', 500);
        ctx.globalAlpha = 1;
      }
    }
  }
  drawButtons();
  ctx.restore();
}

// ---------- 输入 ----------
// 按住 = 空格，或画布上任意不在按钮上的指针（多指按下时只要还有一根在就算按住）。
function toWorld(e) { return { x: (e.clientX - view.ox) / view.s, y: (e.clientY - view.oy) / view.s }; }
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  const p = toWorld(e), hit = buttons().find(b => inRect(p, b));
  if (hit) { if (hit.on) hit.fn(); return; }
  pointers.add(e.pointerId);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 指针已失效 */ }
  if (screen === 'intro') launch();
});
const releasePointer = e => pointers.delete(e.pointerId);
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('lostpointercapture', releasePointer);
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const p = toWorld(e);
  canvas.style.cursor = buttons().some(b => b.on && inRect(p, b)) ? 'pointer' : 'default';
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault(); spaceDown = true;
    if (e.repeat) return;
    ensureAudio();
    if (screen === 'intro') launch();
    else if (screen === 'start') startRound();
  } else if (e.code === 'Enter' && !e.repeat) {
    ensureAudio();
    if (screen === 'start') startRound();
    else if (screen === 'routeDone' && lockT <= 0) nextRoute();
    else if ((screen === 'won' || screen === 'lost') && lockT <= 0) startRound();
  } else if (e.code === 'KeyR' && !e.repeat) restart();
  else if (e.code === 'KeyM' && !e.repeat) muted = !muted;
});
window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });
window.addEventListener('blur', () => { pointers.clear(); spaceDown = false; });

let lastT = 0;
function loop(now) {
  const dt = Math.max(0, (now - lastT) / 1000 || 0);
  lastT = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 主站在水合后才监听消息，单发的 ready 可能丢；重复的 ready 主站会忽略。start 在第一次起飞时才发。
emitMoYuFunEvent('ready');
for (const ms of [500, 2000, 5000]) setTimeout(() => emitMoYuFunEvent('ready'), ms);
</script>
