<script>
'use strict';
/* 生态瓶 v2：伪装成 Excel 的生态瓶实验。设计文档：docs/games/terrarium.md */

// ---------- 物品、光照、实验 ----------
const ITEMS = [
  { key: 'algae', name: '藻类', cost: 3, max: 9, hint: '长得最快，小虾和螺的口粮。没人吃就会疯长成藻华。' },
  { key: 'plant', name: '水草', cost: 8, max: 6, hint: '产氧主力，螺会啃它。铺沙能长得更大。' },
  { key: 'moss', name: '苔藓', cost: 6, max: 6, hint: '耐阴，跳虫的口粮。怕灯下暴晒。' },
  { key: 'shrimp', name: '小虾', cost: 6, max: 9, hint: '只吃藻类，呼吸量大。' },
  { key: 'snail', name: '螺', cost: 5, max: 9, hint: '吃藻类也啃水草。' },
  { key: 'spring', name: '跳虫', cost: 4, max: 6, hint: '吃废物和苔藓，帮忙打扫。一份 10 只。' },
  { key: 'bact', name: '细菌', cost: 4, max: 6, hint: '把废物分解成养分，但分解时要耗氧。' },
  { key: 'sand', name: '沙', cost: 8, max: 2, hint: '水草能长得更大，细菌有更多地方住。' },
  { key: 'char', name: '炭', cost: 10, max: 1, hint: '吸附毒素：废物到 60 才致毒（原本 30）。' },
];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.key, i]));
const LIGHT_NAME = { shade: '背阴', window: '窗边', lamp: '灯下' };
const LIGHT_HINT = { shade: '弱光 10 小时，凉快，呼吸 ×0.8。苔藓最爱。', window: '日照 12 小时，不冷不热。', lamp: '强光 16 小时，长得快也更热（呼吸 ×1.2），苔藓会晒伤。' };
const ACTIONS = [
  { key: 'plant', name: '补种水草', effect: '水草立即 +15', hot: 'Q' },
  { key: 'vent', name: '开盖通气', effect: '换气 48 小时，O₂ 回升', hot: 'W' },
  { key: 'dark', name: '遮光一天', effect: '无光 24 小时，藻类大减', hot: 'E' },
];
const JARS = [
  { name: '对照组', budget: 60, lights: ['shade', 'window', 'lamp'], req: { shrimp: 2 }, days: 60, events: [],
    goals: [{ t: 'end', k: 'shrimp', n: 1.5 }, { t: 'healthy', n: 55 }] },
  { name: '高温', budget: 70, lights: ['window'], req: { shrimp: 3 }, days: 100, events: [{ day: 30, kind: 'heat', days: 2, heat: 4 }],
    goals: [{ t: 'end', k: 'shrimp', n: 1 }, { t: 'healthy', n: 90 }] },
  { name: '灯下', budget: 80, lights: ['lamp'], req: { algae: 4, shrimp: 2 }, days: 100, events: [],
    goals: [{ t: 'end', k: 'shrimp', n: 2 }, { t: 'healthy', n: 80 }] },
  { name: '病害', budget: 80, lights: ['shade', 'window', 'lamp'], req: { plant: 2, snail: 3 }, days: 100, events: [{ day: 35, kind: 'blight', loss: 0.9 }],
    goals: [{ t: 'end', k: 'snail', n: 1.5 }, { t: 'healthy', n: 80 }] },
  { name: '综合', budget: 100, lights: ['shade', 'window', 'lamp'], req: { shrimp: 2, snail: 2, moss: 1 }, days: 100,
    events: [{ day: 40, kind: 'blight', loss: 0.8 }, { day: 70, kind: 'heat', days: 2, heat: 3 }],
    goals: [{ t: 'healthy', n: 80 }, { t: 'species', n: 7 }] },
];
const DIAG = {
  hypo: { title: '缺氧', tip: '夜里大家都在呼吸，光合作用补不回来。少放动物、多放水草，或在 O₂ 变黄时开盖通气。' },
  bloom: { title: '藻华', tip: '藻类疯长又成片死去，腐烂耗尽了氧气。多放小虾和螺，或在藻类变黄时遮光一天。' },
  tox: { title: '废物中毒', tip: '废物没人分解，越过阈值后毒害动物。放细菌、跳虫或一块炭。' },
  starve: { title: '饿死', tip: '小虾只吃藻类，螺吃藻类和水草，跳虫吃废物和苔藓。食物要比动物多。' },
  withered: { title: '植物枯死', tip: '光太弱、养分耗尽，或病害之后没补种。植物变黄时补种水草。' },
};

// ---------- 模型（纯函数，无随机；v1 模型 + 扰动 + 干预） ----------
const LIGHTS = { shade: { I: 0.5, on: 7, off: 17, heat: 0.8 }, window: { I: 1.0, on: 6, off: 18, heat: 1.0 }, lamp: { I: 1.6, on: 5, off: 21, heat: 1.2 } };
const PROD = {
  algae: { mu: 1.2,  pi: 0.9, rho: 0.30, dth: 0.05, K: 100, Isat: 1.2, crowd: 3.0, burn: 0 },
  plant: { mu: 0.4,  pi: 0.6, rho: 0.06, dth: 0.01, K: 60,  Isat: 0.8, crowd: 0,   burn: 0 },
  moss:  { mu: 0.25, pi: 0.4, rho: 0.04, dth: 0.01, K: 40,  Isat: 0.4, crowd: 0,   burn: 0.15 },
};
const ANIM = {
  shrimp: { food: ['algae'],          R: [5],     h: 5,  c: 3.0, b: 0.10, m: 0.01, sg: 0.05, rho: 0.5,  w: 2,   cap: 12 },
  snail:  { food: ['algae', 'plant'], R: [5, 15], h: 10, c: 2.0, b: 0.05, m: 0.01, sg: 0.04, rho: 0.4,  w: 3,   cap: 8 },
  spring: { food: ['W', 'moss'],      R: [0, 10], h: 3,  c: 0.1, b: 0.15, m: 0.03, sg: 0.10, rho: 0.03, w: 0.1, cap: 80 },
};
const BACT = { k: 1.0, hW: 10, kO: 2, y: 0.3, rho: 0.05, od: 1.0, dth: 0.05, K: 30 };
const ENV = { T: 20, O0: 16, N0: 15, kC: 2, kN: 2, nu: 0.2, kappa: 0.5, Olow: 4, hypo: 1.5, Wtox: 30, tox: 0.5, turbA: 60 };
const ACT = { plant: 15, ventH: 48, vent: 0.3, darkH: 24, darkHeat: 0.8, darkKill: 0.5 };
const PORTION = { algae: 10, plant: 10, moss: 10, shrimp: 1, snail: 1, spring: 10, bact: 10 };
const SPECIES = ['algae', 'plant', 'moss', 'shrimp', 'snail', 'spring', 'bact'];
const ANIMALS = ['shrimp', 'snail', 'spring'], PRODUCERS = ['algae', 'plant', 'moss'];
const WARN = { O: 6, algae: 40, prod: 15 };   // 监测面板变黄的线

function costOf(s) { return ITEMS.reduce((a, it) => a + it.cost * s[it.key], 0); }
function setupProblem(def, s) {
  for (const [k, n] of Object.entries(def.req)) if (s[k] < n) return `${ITEM[k].name}至少 ${n} 份`;
  if (costOf(s) > def.budget) return '超出预算';
  return ANIMALS.some(k => s[k] > 0) && PRODUCERS.some(k => s[k] > 0) ? '' : '至少放一种动物和一种植物';
}
function wasteLimit(j) { return ENV.Wtox * (1 + j.char); }
// 模型第 0 小时是第 1 天 06:00。
function lightAt(light, hour) { const L = LIGHTS[light], h = (hour + 6) % 24; return h >= L.on && h < L.off ? L.I : 0; }
function row(j, Omin) { return { day: j.day, O: j.O, Omin, N: j.N, W: j.W, ...Object.fromEntries(SPECIES.map(k => [k, j[k]])) }; }
function createJar(setup, events) {
  const j = { hour: 0, day: 0, O: ENV.O0, C: ENV.T - ENV.O0, N: ENV.N0, W: 0, sand: setup.sand, char: setup.char, light: setup.light,
    events: events || [], vent: 0, dark: 0, used: {}, rescued: false,
    cause: { hypo: 0, tox: 0, starve: 0 }, aHyp: null, hypDay: null, dayMinO: ENV.T, dayMaxW: 0, healthy: 0, history: [] };
  for (const k of SPECIES) j[k] = setup[k] * PORTION[k];
  j.history.push(row(j, j.O));
  return j;
}
function eventStart(e) { return (e.day - 1) * 24; }
function applyEvent(j, e) {
  if (e.kind === 'blight') for (const k of ['plant', 'moss']) { const lost = j[k] * e.loss; j[k] -= lost; j.W += lost; }
}
function heatAt(j) {
  let hot = 1;
  for (const e of j.events) if (e.kind === 'heat' && j.hour >= eventStart(e) && j.hour < eventStart(e) + e.days * 24) hot *= e.heat;
  return hot;
}
// 干预：每种一次，立即生效。返回 false 表示已用过。
function act(j, key) {
  if (j.used[key] !== undefined) return false;
  j.used[key] = j.day + 1;
  if (j.O < ENV.Olow) j.rescued = true;
  if (key === 'plant') j.plant += ACT.plant;
  if (key === 'vent') j.vent = ACT.ventH;
  if (key === 'dark') j.dark = ACT.darkH;
  return true;
}
function stepHour(j) {
  for (const e of j.events) if (j.hour === eventStart(e)) applyEvent(j, e);
  const dt = 1 / 24, L = LIGHTS[j.light], dark = j.dark > 0;
  const I = dark ? 0 : lightAt(j.light, j.hour);
  const fC = j.C / (j.C + ENV.kC), fN = j.N / (j.N + ENV.kN), resp = heatAt(j) * (dark ? ACT.darkHeat : L.heat) * j.O / (j.O + 1);
  const turb = 1 / (1 + j.algae / ENV.turbA);
  const d = { O: 0, N: 0, W: 0, algae: 0, plant: 0, moss: 0, shrimp: 0, snail: 0, spring: 0, bact: 0 };
  for (const k of PRODUCERS) {
    const p = PROD[k], X = j[k]; if (X <= 0) continue;
    const K = p.K * (k === 'plant' ? 1 + 0.5 * j.sand : 1);
    const fI = Math.min(1, I / p.Isat) * turb;
    const grow = p.mu * X * fI * fN * fC * Math.max(0, 1 - X / K);
    const die = (p.dth + p.burn * Math.max(0, I - 1) + p.crowd * Math.max(0, X / K - 0.5) + (dark && k === 'algae' ? ACT.darkKill : 0)) * X;
    d[k] += grow - die; d.N -= ENV.nu * grow; d.W += die;
    d.O += p.pi * X * fI * fC - p.rho * X * resp;
  }
  const hyp = j.O < ENV.Olow ? ENV.hypo * (1 - j.O / ENV.Olow) : 0;
  if (hyp > 0 && j.aHyp === null) { j.aHyp = j.algae; j.hypDay = j.day + 1; }
  const Wt = wasteLimit(j);
  const tox = j.W > Wt ? ENV.tox * Math.min(1, (j.W - Wt) / Wt) : 0;
  for (const k of ANIMALS) {
    const a = ANIM[k], n = j[k]; if (n <= 0) continue;
    const avail = a.food.map((f, i) => Math.max(0, j[f] - a.R[i]));
    const F = avail[0] + (avail[1] || 0), sat = F / (F + a.h), eat = a.c * n * sat;
    if (F > 0) a.food.forEach((f, i) => { d[f] -= eat * avail[i] / F; });
    const starve = a.sg * (1 - sat);
    const deaths = (a.m + starve + hyp + tox) * n;
    d[k] += a.b * n * sat * Math.max(0, 1 - n / a.cap) - deaths;
    d.W += ENV.kappa * eat + a.w * deaths; d.N += ENV.nu * (1 - ENV.kappa) * eat;
    d.O -= a.rho * n * resp;
    j.cause.hypo += hyp * n * a.w * dt; j.cause.tox += tox * n * a.w * dt; j.cause.starve += starve * n * a.w * dt;
  }
  const B = j.bact;
  if (B > 0) {
    const dec = BACT.k * B * j.W / (j.W + BACT.hW) * j.O / (j.O + BACT.kO);
    d.bact += BACT.y * dec * Math.max(0, 1 - B / (BACT.K * (1 + j.sand))) - BACT.dth * B;
    d.W -= dec; d.N += ENV.nu * dec; d.O -= BACT.od * dec + BACT.rho * B * resp;
  }
  for (const k of SPECIES) j[k] = Math.max(0, j[k] + d[k] * dt);
  j.O = Math.min(ENV.T, Math.max(0, j.O + d.O * dt));
  if (j.vent > 0) { j.O += (ENV.O0 - j.O) * ACT.vent; j.vent--; }
  if (j.dark > 0) j.dark--;
  j.C = ENV.T - j.O;
  j.N = Math.max(0, j.N + d.N * dt); j.W = Math.max(0, j.W + d.W * dt);
  j.dayMinO = Math.min(j.dayMinO, j.O); j.dayMaxW = Math.max(j.dayMaxW, j.W);
  j.hour++;
  if (j.hour % 24 === 0) endDay(j);
}
function endDay(j) {
  j.day++;
  for (const k of SPECIES) if (j[k] > 0 && j[k] < 0.5) { j.W += j[k] * (ANIM[k] ? ANIM[k].w : 1); j[k] = 0; }
  if (j.dayMinO >= 8 && j.dayMaxW < 15) j.healthy++;
  j.history.push(row(j, j.dayMinO)); j.dayMinO = ENV.T; j.dayMaxW = 0;
}
function speciesAlive(j) { return SPECIES.filter(k => j[k] > 0).length; }
function diagnose(j, noAnimals) {
  if (!noAnimals) return 'withered';
  const c = j.cause, top = ['hypo', 'tox', 'starve'].reduce((a, b) => (c[b] > c[a] ? b : a));
  return top === 'hypo' && j.aHyp >= 40 ? 'bloom' : top;
}
// 每天结束时调用：崩溃 → 0 星；到期 → 1 星 + 达成的附加目标数；否则 null。
function outcome(def, j) {
  const noA = ANIMALS.every(k => j[k] === 0), noP = PRODUCERS.every(k => j[k] === 0);
  if (noA || noP) return { stars: 0, day: j.day, diagnosis: diagnose(j, noA) };
  if (j.day >= def.days) return { stars: 1 + def.goals.filter(g => goalMet(g, j)).length, day: j.day, diagnosis: null };
  return null;
}
function goalMet(g, j) {
  if (g.t === 'end') return j[g.k] >= g.n;
  if (g.t === 'healthy') return j.healthy >= g.n;
  return speciesAlive(j) >= g.n;
}
function goalText(def, g) {
  if (g.t === 'end') return `第 ${def.days} 天 ${ITEM[g.k].name} ≥ ${g.n}`;
  if (g.t === 'healthy') return `健康天数 ≥ ${g.n}`;
  return `第 ${def.days} 天 ${g.n} 种全部存活`;
}
function eventText(e) {
  return e.kind === 'heat' ? `第 ${e.day}–${e.day + e.days - 1} 天 空调停机：呼吸 ×${e.heat}` : `第 ${e.day} 天 水草病害：水草和苔藓损失 ${Math.round(e.loss * 100)}%`;
}

// ---------- MoYuFun SDK v1 ----------
const MOYUFUN_PARENT_ORIGIN = location.hostname === 'localhost'
  ? 'http://localhost:3000'
  : 'https://www.moyufuns.com';
function emitMoYuFunEvent(type) {
  if (window.parent === window) return;
  window.parent.postMessage({ source: 'moyufun-game', version: 1, type }, MOYUFUN_PARENT_ORIGIN);
}
function emitMoYuFunAchievement(key) {
  if (window.parent === window) return;
  window.parent.postMessage({ source: 'moyufun-game', version: 1, type: 'achievement', key }, MOYUFUN_PARENT_ORIGIN);
}
// 战绩：每局结算时发送一次，在成就之后、end 之前；键和上限在 game.json 的 stats 中声明。
function emitMoYuFunStats(stats) {
  if (window.parent === window) return;
  window.parent.postMessage({ source: 'moyufun-game', version: 1, type: 'stats', stats }, MOYUFUN_PARENT_ORIGIN);
}
// 伪装：每次 ready 之后发送，标题或皮肤变化时再发。
function emitMoYuFunDisguise(app, title) {
  if (window.parent === window) return;
  window.parent.postMessage({ source: 'moyufun-game', version: 1, type: 'disguise', app, title }, MOYUFUN_PARENT_ORIGIN);
}
// 成就：每局每个 key 最多发送一次；结算时的成就必须在 end 之前发送（主站在 end 后忽略成就）。
let roundAchievements = new Set();
function unlockAchievement(key) {
  if (roundAchievements.has(key)) return;
  roundAchievements.add(key);
  emitMoYuFunAchievement(key);
}
const DISGUISE_TITLE = '实验数据_生态系统稳定性.xlsx - Excel';

// ---------- 音频（默认静音，M 切换） ----------
let AC = null, master = null, muted = true;
function ensureAudio() {
  if (muted) return;
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.15; master.connect(AC.destination);
    } catch (err) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, at) {
  if (!AC || muted) return;
  const t = AC.currentTime + (at || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
const tick = () => tone(1800, 1700, 0.03, 'square', 0.15);

// ---------- 随机（只用于老板键文档的数字；模型不碰） ----------
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;

// ---------- 存档（每个实验的最佳星数；存储失败就只在内存里） ----------
const SAVE_KEY = 'moyufun:terrarium:v2';
function loadBest() {
  try { const a = JSON.parse(localStorage.getItem(SAVE_KEY)); if (Array.isArray(a) && a.length === 5) return a.map(n => Math.max(0, Math.min(3, n | 0))); } catch (err) { /* 无存储 */ }
  return [0, 0, 0, 0, 0];
}
function saveBest() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(best)); } catch (err) { /* 无存储 */ } }

// ---------- 游戏状态 ----------
function setupFor(def) {
  const s = { algae: 0, plant: 0, moss: 0, shrimp: 0, snail: 0, spring: 0, bact: 0, sand: 0, char: 0, light: def.lights.includes('window') ? 'window' : def.lights[0] };
  return Object.assign(s, def.req);
}
let jarIdx = 0, setups = JARS.map(setupFor), phase = 'setup', jar = null, result = null;
let speed = 1, lastSpeed = 1, acc = 0, boss = false, best = loadBest();
let sel = { c: 1, r: 8 }, formula = '', status = '', statusT = 0, flash = {}, dropdown = false, gameT = 0;
const HOURS_PER_SEC = 40;   // 1× 下 100 天约 60 秒

function def() { return JARS[jarIdx]; }
function setup() { return setups[jarIdx]; }
function say(text) { status = text; statusT = 4; }
function flashCell(c, r, color) { flash[c + ',' + r] = { t: 0.6, color }; }

function selectJar(i) {
  if (i < 0 || i >= JARS.length || i === jarIdx && phase === 'setup') return false;
  if (phase === 'run') { say('实验进行中，先做完这一瓶'); return false; }
  jarIdx = i; phase = 'setup'; jar = null; result = null; dropdown = false;
  sel = { c: 1, r: 8 }; formula = '';
  say(`实验${i + 1}：${def().name}`);
  return true;
}
function adjust(key, delta) {
  const it = ITEM[key], s = setup();
  if (phase !== 'setup' || !it) return false;
  const r = 5 + ITEMS.indexOf(it), n = s[key] + delta, min = def().req[key] || 0;
  sel = { c: 1, r }; formula = `=${it.cost}*B${r}`;
  if (n < min || n > it.max || (delta > 0 && costOf(s) + it.cost * delta > def().budget)) {
    say(n < min ? `实验要求：${it.name}至少 ${min} 份` : n > it.max ? `${it.name}最多 ${it.max} 份` : `超出预算 ${def().budget}`);
    flashCell(n < min || n > it.max ? 1 : 3, n < min || n > it.max ? r : 14, '#ffc7ce');
    tone(200, 170, 0.08, 'square', 0.15);
    return false;
  }
  s[key] = n; flashCell(3, r, '#fff2cc'); say(it.hint); tick();
  return true;
}
function setLight(key) {
  if (phase !== 'setup' || !LIGHTS[key]) return false;
  dropdown = false;
  if (!def().lights.includes(key)) { say(`实验条件：光照固定为${LIGHT_NAME[def().lights[0]]}`); return false; }
  setup().light = key; sel = { c: 1, r: 15 }; formula = LIGHT_NAME[key]; say(LIGHT_HINT[key]); tick();
  return true;
}
function cycleLight(d) {
  const ls = def().lights, i = ls.indexOf(setup().light);
  if (ls.length < 2) { say(`实验条件：光照固定为${LIGHT_NAME[ls[0]]}`); return false; }
  return setLight(ls[(i + d + ls.length) % ls.length]);
}
function run() {
  if (phase !== 'setup') return false;
  const p = setupProblem(def(), setup());
  if (p) { say(p); flashCell(3, 14, '#ffc7ce'); return false; }
  jar = createJar(setup(), def().events);
  roundAchievements = new Set();
  emitMoYuFunEvent('start');

  else if (j) note = '实验进行中。O₂ 变黄就开盖，藻类变黄就遮光，植物变黄就补种。';
  ctx.fillStyle = '#fff'; ctx.fillRect(colX(1) + 1, rowY(28) + 1, colX(5) - colX(1) - 2, RH * 2 - 2);
  wrap(note, colX(1) + 5, rowY(28) + 11, colX(5) - colX(1) - 10, 2, result && !result.stars ? '#9c0006' : '#444');
  // 右侧：监测面板
  put(6, 1, '监测面板', { bold: true, size: 14, span: 3 });
  const kpi = [['天数', j ? Math.min(d.days, j.day + (phase === 'run' ? 1 : 0)) : 0, null]];
  if (j) {
    const prod = j.plant + j.moss, Wt = wasteLimit(j);
    kpi.push(['O₂', j.O, j.O < ENV.Olow ? BAD : j.O < WARN.O ? MID : GOOD]);
    kpi.push(['CO₂', j.C, null]);
    kpi.push(['废物', j.W, j.W > Wt ? BAD : j.W > 0.7 * Wt ? MID : GOOD]);
    kpi.push(['藻类', j.algae, j.algae > WARN.algae ? MID : GOOD]);
    kpi.push(['水草+苔藓', prod, prod < WARN.prod ? MID : GOOD]);
  } else ['O₂', 'CO₂', '废物', '藻类', '水草+苔藓'].forEach(h => kpi.push([h, '—', null]));
  kpi.forEach(([h, v, cf], i) => { put(6 + i, 2, h, { fill: '#f2f2f2', bold: true, align: 'right' }); fmtCell(6 + i, 3, v, cf, { align: 'right' }); });
}
function drawSpin(r) {
  const x = colX(2) - 16, y = rowY(r);
  ctx.fillStyle = '#f3f3f3'; ctx.fillRect(x, y + 1, 15, RH - 2);
  ctx.strokeStyle = '#adadad'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 1.5, 14, RH - 3);
  ctx.beginPath(); ctx.moveTo(x, y + RH / 2); ctx.lineTo(x + 15, y + RH / 2); ctx.stroke();
  ctx.fillStyle = '#444';
  ctx.beginPath(); ctx.moveTo(x + 4, y + 9); ctx.lineTo(x + 11, y + 9); ctx.lineTo(x + 7.5, y + 4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 4, y + 13); ctx.lineTo(x + 11, y + 13); ctx.lineTo(x + 7.5, y + 18); ctx.fill();
}
function wrap(s, x, y, w, lines, color) {
  ctx.font = `12px ${SANS}`; ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let line = '', n = 0;
  for (const ch of s) {
    // 按字符类估宽（CJK = 字号，ASCII = 一半），无头桩里也能跑。
    if (textW(line + ch) > w) { ctx.fillText(line, x, y + n * RH); line = ''; if (++n >= lines) return; }
    line += ch;
  }
  ctx.fillText(line, x, y + n * RH);
}
function textW(s) { let w = 0; for (const ch of s) w += ch.charCodeAt(0) > 255 ? 12 : 6.5; return w; }
function drawDropdown() {
  const x = colX(1), y = rowY(16), w = colX(4) - colX(1), ls = def().lights;
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, ls.length * RH);
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, ls.length * RH - 1);
  ls.forEach((k, i) => {
    if (k === setup().light) { ctx.fillStyle = '#cce8d6'; ctx.fillRect(x + 1, y + i * RH + 1, w - 2, RH - 2); }
    txt(`${LIGHT_NAME[k]}  ${LIGHT_HINT[k].slice(0, 8)}…`, x + 6, y + i * RH + RH / 2, { size: 11 });
  });
}

// ---------- 图表（Excel 折线图样式） ----------
const SERIES_COLORS = ['#4472c4', '#ed7d31', '#a5a5a5', '#ffc000', '#5b9bd5', '#70ad47', '#264478'];
function chartRows() {
  if (!jar) return [];
  const live = { ...row(jar, jar.O), day: jar.hour / 24, Omin: jar.O };
  return jar.hour % 24 ? [...jar.history, live] : jar.history;
}
function drawCharts() {
  const rows = chartRows(), x = colX(6) + 4, w = colX(12) - colX(6) - 8;
  chart(x, rowY(5) + 4, w, RH * 8 - 8, '生物量', rows, [['藻类', 'algae'], ['水草', 'plant'], ['苔藓', 'moss'], ['细菌', 'bact']]);
  chart(x, rowY(13) + 4, w, RH * 8 - 8, '动物数量', rows, [['小虾', 'shrimp'], ['螺', 'snail'], ['跳虫 (÷10)', r => r.spring / 10]]);
  chart(x, rowY(21) + 4, w, RH * 8 - 8, '气体与废物', rows, [['O₂', 'Omin'], ['CO₂', r => ENV.T - r.Omin], ['废物', 'W']], true);
}
function chart(x, y, w, h, title, rows, series, gas) {
  const days = def().days;
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#d9d9d9'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  txt(title, x + w / 2, y + 12, { align: 'center', color: '#595959', size: 12 });
  const get = (r, f) => (typeof f === 'function' ? f(r) : r[f]);
  let max = gas ? 20 : 1;
  for (const r of rows) for (const [, f] of series) max = Math.max(max, get(r, f));
  const step = niceStep(max / 4); max = Math.ceil(max / step) * step;
  const px = x + 34, py = y + 24, pw = w - 44, ph = h - 52;
  for (let v = 0; v <= max + 1e-9; v += step) {
    const yy = py + ph - v / max * ph;
    ctx.strokeStyle = '#e7e7e7'; ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + pw, yy); ctx.stroke();
    txt(fmt(v), px - 4, yy, { align: 'right', color: '#595959', size: 9 });
  }
  for (let dd = 0; dd <= days; dd += days / 5) txt(String(dd), px + dd / days * pw, py + ph + 8, { align: 'center', color: '#595959', size: 9 });
  if (gas) {
    if (jar) {
      for (const e of def().events) { const a = (e.day - 1) / days, b = Math.min(1, (e.day - 1 + (e.days || 1)) / days); ctx.fillStyle = 'rgba(255,199,206,.45)'; ctx.fillRect(px + a * pw, py, (b - a) * pw, ph); }
      ACTIONS.forEach(a => { const d0 = jar.used[a.key]; if (d0 === undefined) return; const xx = px + (d0 - 1) / days * pw; ctx.strokeStyle = '#7f7f7f'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(xx, py); ctx.lineTo(xx, py + ph); ctx.stroke(); ctx.setLineDash([]); txt(a.name.slice(0, 2), xx + 2, py + 6, { size: 9, color: '#595959' }); });
    }
    const yy = py + ph - ENV.Olow / max * ph;
    ctx.strokeStyle = '#c00000'; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + pw, yy); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(px, py - 2, pw, ph + 4); ctx.clip();
  series.forEach(([, f], i) => {
    if (rows.length < 2) return;
    ctx.strokeStyle = SERIES_COLORS[i]; ctx.lineWidth = 2; ctx.beginPath();
    rows.forEach((r, k) => { const xx = px + r.day / days * pw, yy = py + ph - Math.min(max, get(r, f)) / max * ph; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); });
    ctx.stroke();
  });
  ctx.restore();
  if (!rows.length) txt('（无数据）', px + pw / 2, py + ph / 2, { align: 'center', color: '#a6a6a6', size: 11 });
  let lx = x + w / 2 - series.length * 34;
  series.forEach(([name], i) => {
    ctx.fillStyle = SERIES_COLORS[i]; ctx.fillRect(lx, y + h - 11, 14, 2);
    txt(name, lx + 18, y + h - 10, { size: 10, color: '#595959' }); lx += 18 + textW(name) * 0.85 + 14;
  });
}
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1e-6)))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

// ---------- 老板键：一张普通的费用表 ----------
const BOSS_ROWS = (() => {
  const r = mulberry32(20261005), depts = ['行政部', '财务部', '市场部', '研发一部', '研发二部', '销售华东', '销售华北', '人力资源', '采购部', '客服中心', '法务部', '品牌部'];
  return depts.map(d => { const base = 12000 + r() * 30000; return [d, ...[0, 1, 2, 3].map(() => Math.round(base * (0.85 + r() * 0.3)))]; });
})();
function drawBossSheet() {
  ['部门', 'Q1', 'Q2', 'Q3', 'Q4', '', '合计', '环比'].forEach((h, c) => h && put(c, 1, h, { bold: true, align: c ? 'right' : 'left', fill: '#f2f2f2' }));
  BOSS_ROWS.forEach((rw, i) => {
    const r = 2 + i, sum = rw[1] + rw[2] + rw[3] + rw[4];
    put(0, r, rw[0]); for (let c = 1; c <= 4; c++) put(c, r, rw[c].toLocaleString('en-US'), { align: 'right' });
    put(6, r, sum.toLocaleString('en-US'), { align: 'right' }); put(7, r, ((rw[4] / rw[3] - 1) * 100).toFixed(1) + '%', { align: 'right' });
  });
}

// ---------- 输入 ----------
function pointerAt(e) { return { x: e.clientX, y: e.clientY }; }
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (boss) return;
  const p = pointerAt(e);
  if (p.y >= view.h - BOTTOM && p.y < view.h - BOTTOM + 26) {
    const t = tabRects().find(t => p.x >= t.x && p.x < t.x + t.w);
    if (t) selectJar(t.i);
    return;
  }
  if (p.y < TOP || p.y >= view.h - BOTTOM) return;
  const q = toSheet(p.x, p.y);
  const hit = targets().find(t => q.x >= t.x && q.x < t.x + t.w && q.y >= t.y && q.y < t.y + t.h);
  const wasOpen = dropdown;
  if (hit) hit.fn();
  else if (q.x >= RHW && q.y >= HDR) { sel = hitCell(q); formula = ''; }
  if (wasOpen) dropdown = false;   // 下拉框开着时，任何点击都会把它关上
});
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { e.preventDefault(); toggleBoss(); return; }
  if (boss) return;
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if (k === 'PageDown' || k === 'PageUp') { e.preventDefault(); selectJar(jarIdx + (k === 'PageDown' ? 1 : -1)); return; }
  if (phase === 'setup') {
    const rows = [...ITEMS.map((_, i) => 5 + i), 15];
    if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); const i = rows.indexOf(sel.r); sel = { c: 1, r: rows[Math.max(0, Math.min(rows.length - 1, (i < 0 ? 0 : i + (k === 'ArrowDown' ? 1 : -1))))] }; formula = ''; return; }
    const d = k === '+' || k === '=' || k === 'ArrowRight' ? 1 : k === '-' || k === '_' || k === 'ArrowLeft' ? -1 : 0;
    if (d) { e.preventDefault(); if (sel.r === 15) cycleLight(d); else if (sel.r >= 5 && sel.r <= 13) adjust(ITEMS[sel.r - 5].key, d); return; }
    if (k === 'Enter') { e.preventDefault(); run(); }
    return;
  }
  if (phase === 'run') {
    if (k === ' ') { e.preventDefault(); togglePause(); }
    if (k === '1' || k === '2' || k === '3') setSpeed([1, 2, 4][+k - 1]);
    const a = ACTIONS.find(a => a.hot === k.toUpperCase());
    if (a) intervene(a.key);
    return;
  }
  if (k === 'Enter') { e.preventDefault(); again(); }
});
// 窗口失焦（切到别的窗口）时暂停，免得瓶子在没人看的时候死掉。
window.addEventListener('blur', () => { if (phase === 'run' && speed) setSpeed(0); });

let lastT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0);
  lastT = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 主站在水合后才监听消息，单发的 ready 可能丢；重复的 ready 主站会忽略。每次 ready 后跟一条 disguise。
function announce() { emitMoYuFunEvent('ready'); emitMoYuFunDisguise('excel', DISGUISE_TITLE); }
announce();
for (const ms of [500, 2000, 5000]) setTimeout(announce, ms);
</script>
