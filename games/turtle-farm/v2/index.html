<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农产品采购计划_2026.xlsx - Excel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff;
    user-select: none; -webkit-user-select: none; }
  #game { position: absolute; inset: 0; display: block; touch-action: none; cursor: cell; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* 玄武农场 v2：Excel 伪装。设计文档：docs/games/turtle-farm.md */

// ---------- 常量 ----------
const DAYS = 30, DAY_SECONDS = 8, TARGET = 800, TYCOON = 1500, START_COINS = 40, RIPE_WAIT = 3;
const MARKET_DAYS = [6, 12, 18, 24, 30];
const LANDS = ['grass', 'rain', 'desert', 'snow'];
const BIOMES = { grass: '草原', rain: '雨林', desert: '沙漠', snow: '雪原', market: '集市' };
const CROPS = [
  { key: 'radish', name: '萝卜', cost: 2, days: 2, sell: 5, likes: ['snow'], hates: ['desert'], tough: 1 },
  { key: 'corn', name: '玉米', cost: 4, days: 3, sell: 10, likes: ['grass'], hates: ['snow'], tough: 1 },
  { key: 'mushroom', name: '蘑菇', cost: 5, days: 3, sell: 13, likes: ['rain'], hates: ['grass', 'desert'], tough: 1 },
  { key: 'cactus', name: '仙人掌', cost: 3, days: 4, sell: 9, likes: ['desert'], hates: ['rain'], tough: 2 },
  { key: 'melon', name: '西瓜', cost: 6, days: 4, sell: 18, likes: ['desert'], hates: ['rain', 'snow'], tough: 1 },
  { key: 'banana', name: '香蕉', cost: 8, days: 5, sell: 26, likes: ['rain'], hates: ['desert', 'snow'], tough: 1 },
  { key: 'icegrape', name: '冰葡萄', cost: 10, days: 5, sell: 34, likes: ['snow'], hates: ['grass', 'rain', 'desert'], tough: 0 },
  { key: 'potato', name: '土豆', cost: 3, days: 4, sell: 7, likes: [], hates: [], tough: 99 },
];
const REL_NAME = ['忌', '平', '喜'];
const APP = 'excel', WINDOW_TITLE = '农产品采购计划_2026.xlsx - Excel';

// ---------- MoYuFun SDK v1 ----------
const MOYUFUN_PARENT_ORIGIN = location.hostname === 'localhost'
  ? 'http://localhost:3000'
  : 'https://www.moyufuns.com';
function emitMoYuFunEvent(type) {
  if (window.parent === window) return;
  window.parent.postMessage({ source: 'moyufun-game', version: 1, type }, MOYUFUN_PARENT_ORIGIN);
}
function emitMoYuFunAchievement(key) {
  if (window.parent === window) return;
  window.parent.postMessage({ source: 'moyufun-game', version: 1, type: 'achievement', key }, MOYUFUN_PARENT_ORIGIN);
}
// 战绩：每局结算时发送一次，在成就之后、end 之前；键和上限在 game.json 的 stats 中声明。
function emitMoYuFunStats(stats) {
  if (window.parent === window) return;
  window.parent.postMessage({ source: 'moyufun-game', version: 1, type: 'stats', stats }, MOYUFUN_PARENT_ORIGIN);
}
// 伪装：每次 ready 之后发送，告诉主站这个游戏像哪个软件、标签页标题是什么。
function emitMoYuFunDisguise(app, title) {
  if (window.parent === window) return;
  window.parent.postMessage({ source: 'moyufun-game', version: 1, type: 'disguise', app, title }, MOYUFUN_PARENT_ORIGIN);
}
// 成就：每局每个 key 最多发送一次；结算时的成就必须在 end 之前发送（主站在 end 后忽略成就）。
let roundAchievements = new Set();
function unlockAchievement(key) {
  if (roundAchievements.has(key)) return;
  roundAchievements.add(key);
  emitMoYuFunAchievement(key);
}

// ---------- 音频（默认静音，M 开关） ----------
let AC = null, master = null, muted = true;
function ensureAudio() {
  if (muted) return;
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.12; master.connect(AC.destination);
    } catch (err) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.001, AC.currentTime);
  g.gain.setValueAtTime(vol || 1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  plant: () => tone(240, 150, 0.08, 'triangle', 0.5),
  harvest: () => tone(480, 1100, 0.12, 'sine', 0.5),
  sell: () => { tone(988, 988, 0.06, 'square', 0.2); tone(1319, 1319, 0.14, 'square', 0.2, 0.07); },
  wither: () => tone(420, 110, 0.4, 'sawtooth', 0.2),
  market: () => { tone(392, 392, 0.2, 'triangle', 0.4); tone(523, 523, 0.32, 'triangle', 0.4, 0.2); },
  nope: () => tone(190, 150, 0.12, 'square', 0.16),
  win: () => [523, 659, 784, 1046].forEach((f, k) => tone(f, f, 0.22, 'triangle', 0.4, k * 0.11)),
  lose: () => tone(330, 110, 0.6, 'triangle', 0.35),
};

// ---------- 随机与航线 ----------
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;   // 测试里换成 mulberry32(seed)

// 地形段长 2–3 天，第一段是草原，相邻两段不同；集市固定在 6/12/18/24/30 天。（与 v1 相同）
function genRoute(rnd) {
  const route = [null];
  let prev = null;
  while (route.length <= DAYS) {
    let b = 'grass';
    if (prev) do b = LANDS[Math.floor(rnd() * 4)]; while (b === prev);
    const len = 2 + Math.floor(rnd() * 2);
    for (let i = 0; i < len && route.length <= DAYS; i++) route.push(b);
    prev = b;
  }
  const markets = {};
  for (const d of MARKET_DAYS) {
    route[d] = 'market';
    const hot = Math.floor(rnd() * 8);
    let cold;
    do cold = Math.floor(rnd() * 8); while (cold === hot);
    markets[d] = { hot, cold };
  }
  return { route, markets };
}

// ---------- 状态与规则 ----------
// phase: 'ready'（打开即是表格，时钟不走）→ 第一次播种 → 'play' → 'end'
function newState(phase) {
  return {
    phase, day: 1, dayT: 0, paused: false, coins: START_COINS, route: [], markets: {},
    selected: 0, plots: Array(16).fill(null), barn: Array(8).fill(0), harvests: 0, lost: 0, soldHotToday: 0,
  };
}
let state = newState('ready');

function relation(c, b) {
  if (b === 'market') return 1;
  const C = CROPS[c];
  return C.likes.includes(b) ? 2 : C.hates.includes(b) ? 0 : 1;
}
// 第 d 天的单价：集市日按行情（热销 ×2、滞销 ×0.5），其他日子收购商按售价一半收。
function price(c, d) {
  const sell = CROPS[c].sell, m = state.route[d] === 'market' && state.markets[d];
  if (!m) return Math.floor(sell / 2);
  return m.hot === c ? sell * 2 : m.cold === c ? Math.floor(sell / 2) : sell;
}
function isMarketDay() { return state.route[state.day] === 'market'; }
function landList(list) { return list.map(b => BIOMES[b]).join('/'); }
function seedFormula(c) {
  const C = CROPS[c];
  const tail = C.likes.length || C.hates.length
    ? `, 喜 "${landList(C.likes) || '—'}", 忌 "${landList(C.hates) || '—'}", 耐 ${C.tough}` : ', 不挑地形';
  return `=种子("${C.name}", 进价 ${C.cost}, 周期 ${C.days}, 售价 ${C.sell}${tail})`;
}

function beginPlay() {
  if (state.phase !== 'ready') return;
  state.phase = 'play';
  emitMoYuFunEvent('start');
}
function plant(i, c) {
  if (state.phase === 'ready') beginPlay();
  if (state.phase !== 'play' || state.plots[i]) return false;
  const C = CROPS[c];
  if (state.coins < C.cost) {
    say(`余额不足：${C.name}进价 ${C.cost}，当前 ${state.coins}`, true);
    flash(COIN_CELL.c, COIN_CELL.r, BAD); flash(COL.cost, ROW.seed0 + c, BAD); sfx.nope();
    return false;
  }
  state.coins -= C.cost;
  state.plots[i] = { crop: c, pts: 0, harm: 0, ripe: false, age: 0, allLiked: true, withered: false };
  const f = fieldCell(i); flash(f.c, f.r, SEL);
  sfx.plant();
  return true;
}
function harvest(i) {
  const p = state.plots[i];
  if (state.phase !== 'play' || !p) return false;
  const f = fieldCell(i);
  if (p.withered) { state.plots[i] = null; flash(f.c, f.r, BAD); return false; }
  if (!p.ripe) return false;
  state.barn[p.crop]++; state.harvests++; state.plots[i] = null;
  if (p.allLiked) unlockAchievement('thrive');
  flash(f.c, f.r, GOOD); flash(COL.stock, ROW.seed0 + p.crop, GOOD);
  sfx.harvest();
  return true;
}
function sell(c) {
  if (state.phase !== 'play') return 0;
  const n = state.barn[c];
  if (!n) return 0;
  const gained = price(c, state.day) * n;
  state.coins += gained; state.barn[c] = 0;
  if (isMarketDay() && state.markets[state.day].hot === c) {
    state.soldHotToday += n;
    if (state.soldHotToday >= 5) unlockAchievement('hot_seller');
  }
  say(`已卖出 ${CROPS[c].name} ×${n}，+${gained}${isMarketDay() ? '' : '（收购商半价）'}`);
  flash(COL.price, ROW.seed0 + c, GOOD); flash(COIN_CELL.c, COIN_CELL.r, GOOD);
  sfx.sell();
  return gained;
}
function sellAll() {
  let gained = 0;
  for (let c = 0; c < CROPS.length; c++) gained += sell(c);
  if (gained) say(`全部卖出，+${gained}`);
  return gained;
}
// 集市日时钟停住；离开集市就是这一天结束（集市日对所有作物都算「平」）。
function leaveMarket() {
  if (state.phase !== 'play' || !isMarketDay()) return false;
  state.dayT = 0;
  endOfDay();
  return true;
}

function endOfDay() {
  const d = state.day, b = state.route[d], plots = state.plots, rotted = {}, withered = {};
  plots.forEach((p, i) => { if (p && p.withered) plots[i] = null; });
  plots.forEach((p, i) => {
    if (!p) return;
    const C = CROPS[p.crop], f = fieldCell(i);
    if (p.ripe) {
      if (++p.age >= RIPE_WAIT) { state.lost++; plots[i] = null; rotted[C.name] = (rotted[C.name] || 0) + 1; flash(f.c, f.r, BAD); }
      return;
    }
    const r = relation(p.crop, b);
    if (r === 2) p.pts += 3;
    else if (r === 1) { p.pts += 2; p.allLiked = false; }
    else {
      p.harm++; p.allLiked = false;
      if (p.harm > C.tough) {
        p.withered = true; state.lost++; withered[C.name] = (withered[C.name] || 0) + 1; flash(f.c, f.r, BAD);
        return;
      }
    }
    if (p.pts >= 2 * C.days) { p.ripe = true; flash(f.c, f.r, GOOD); }
  });
  const lossText = Object.entries(rotted).map(([n, k]) => `${n}×${k} 烂在地里`)
    .concat(Object.entries(withered).map(([n, k]) => `${n}×${k} 枯萎`)).join('，');
  if (Object.keys(withered).length) sfx.wither();
  if (d >= DAYS) { finishVoyage(); return; }
  state.day++; state.soldHotToday = 0;
  for (let c = 1; c <= 6; c++) flash(c, ROW.land, SEL, 0.5);
  if (isMarketDay()) {
    sfx.market();
    say(state.day === DAYS ? '最后一站集市：卖完点「靠岸结算」' : '到集市了：时间暂停，卖完点「离开集市」');
  } else if (lossText) say(lossText, true);
}

function update(dt) {
  animate(dt);
  if (boss || state.phase !== 'play' || state.paused || isMarketDay()) return;
  state.dayT += dt;
  while (state.dayT >= DAY_SECONDS && state.phase === 'play' && !isMarketDay()) {
    state.dayT -= DAY_SECONDS;
    endOfDay();
  }
  if (isMarketDay()) state.dayT = 0;
}

function newRound() {
  state = newState('ready');
  ({ route: state.route, markets: state.markets } = genRoute(rng));
  roundAchievements = new Set();
  resetFx();
}
function startRound() { newRound(); beginPlay(); }
function finishVoyage() {
  if (state.phase !== 'play') return;
  state.phase = 'end'; endT = 0;
  const win = state.coins >= TARGET;
  if (win) {
    unlockAchievement('voyage');
    if (state.lost === 0) unlockAchievement('no_loss');
  }
  if (state.coins >= TYCOON) unlockAchievement('tycoon');
  emitMoYuFunStats({ rounds: 1, wins: win ? 1 : 0, harvests: Math.min(state.harvests, 300), coins: Math.min(state.coins, 1000000) });
  emitMoYuFunEvent('end');
  say('结算完成');
  if (win) sfx.win(); else sfx.lose();
}
function togglePause() {
  if (state.phase !== 'play') return;
  state.paused = !state.paused;
  say(state.paused ? '已暂停：仍可播种、收获、卖出（空格继续）' : '继续');
}
function selectSeed(c) {
  if (state.phase === 'end') return;
  state.selected = c;
  active = { c: COL.name, r: ROW.seed0 + c };
}
let boss = false;
function toggleBoss() { boss = !boss; drag = null; }

// ---------- 反馈 ----------
const GOOD = 'rgba(0,176,80,', BAD = 'rgba(192,0,0,', SEL = 'rgba(33,115,70,';
let flashes = [], msg = null, time = 0, endT = 0, dispCoins = START_COINS;
let active = { c: 0, r: 0 };
function resetFx() { flashes = []; msg = null; dispCoins = state.coins; active = { c: 0, r: 0 }; }
function flash(c, r, color, dur) { flashes.push({ c, r, color, t: dur || 0.45, max: dur || 0.45 }); }
function say(text, bad) { msg = { text, bad, t: 3 }; }
function animate(dt) {
  if (boss) return;
  time += dt; endT += dt;
  dispCoins += (state.coins - dispCoins) * Math.min(1, dt * 10);
  if (Math.abs(state.coins - dispCoins) < 0.5) dispCoins = state.coins;
  for (const f of flashes) f.t -= dt;
  flashes = flashes.filter(f => f.t > 0);
  if (msg && (msg.t -= dt) <= 0) msg = null;
}

// ---------- 表格布局（逻辑像素，100% 缩放） ----------
// A 标签 | B–G 预报（B–E 也是田） | H 空 | I–P 种子目录 | Q 空 | R–T 仓库
const COLW = [60, 60, 60, 60, 60, 60, 60, 12, 22, 60, 36, 36, 36, 44, 90, 30, 12, 40, 50, 56];
const ROWH = [26, 22, 22, 22, 22, 22, 22, 22, 22, 22, 22, 22, 22, 22];
const COL = { label: 0, day0: 1, check: 8, name: 9, cost: 10, days: 11, sell: 12, likes: 13, hates: 14, tough: 15, stock: 17, price: 18, act: 19 };
const ROW = { title: 0, head: 1, land: 2, fit: 3, hot: 4, cold: 5, fieldHead: 7, field0: 8, seed0: 2, total: 10, note: 13 };
const COIN_CELL = { c: 10, r: 0 };
const BTN = { c: 5, r: 8, w: 2, h: 2 };   // 「离开集市」按钮占 F9:G10
function fieldCell(i) { return { c: COL.day0 + (i % 4), r: ROW.field0 + Math.floor(i / 4) }; }
function fieldIndex(c, r) {
  const x = c - COL.day0, y = r - ROW.field0;
  return x >= 0 && x < 4 && y >= 0 && y < 4 ? y * 4 + x : -1;
}
function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }

// ---------- 单元格内容 ----------
const C_GOOD = ['#c6efce', '#006100'], C_BAD = ['#ffc7ce', '#9c0006'], C_NEU = ['#ffeb9c', '#9c5700'];
const HEAD_FILL = '#ddebf7', LINK = '#0563c1';
function landCell(d) { return d > DAYS ? '' : BIOMES[state.route[d]] || ''; }
// 每帧从 state 生成；key = "c,r"。字段：t 文本、a 对齐、b 粗体、fill、color、bar {p, fill, line}、icon 0/1/2、check、link、f 公式、box 表格边框、spill 溢出
function buildSheet() {
  const S = new Map(), put = (c, r, o) => S.set(c + ',' + r, o), s = state, sel = s.selected;
  const market = isMarketDay();
  put(0, ROW.title, { t: '玄武物流 · 农产品采购计划', b: true, size: 14, spill: true });
  put(9, ROW.title, { t: '余额', a: 'r', color: '#595959' });
  put(10, ROW.title, { t: String(Math.round(dispCoins)), a: 'r', b: true, f: `=SUM(收入)-SUM(进货)  ' ${s.coins}` });
  put(11, ROW.title, { t: '目标', a: 'r', color: '#595959' });
  put(12, ROW.title, { t: String(TARGET), a: 'r' });
  put(13, ROW.title, { t: '进度', a: 'r', color: '#595959' });
  put(14, ROW.title, { t: `第 ${s.day} / ${DAYS} 天`, a: 'c' });

  // 地形预报：表头一行日期，下面是地形、所选种子的适宜度、集市行情
  const labels = [[ROW.head, '日期'], [ROW.land, '地形'], [ROW.fit, '适宜度'], [ROW.hot, '热销'], [ROW.cold, '滞销']];
  for (const [r, t] of labels) put(0, r, { t, b: true, fill: r === ROW.head ? HEAD_FILL : '#f2f2f2', box: true });
  for (let k = 0; k < 6; k++) {
    const c = COL.day0 + k, d = s.day + k, past = d > DAYS, isM = !past && s.route[d] === 'market';
    put(c, ROW.head, { t: past ? '—' : k ? `第${d}天` : '今天', a: 'c', b: true, fill: HEAD_FILL, box: true, f: past ? '' : `=第${d}天` });
    const land = { t: landCell(d), a: 'c', b: isM, box: true, f: past ? '' : `=路线(${d})  ' ${landCell(d)}` };
    if (!k && s.phase === 'play' && !past) {
      if (isM) land.t = '集市 ⏸';
      else land.bar = { p: s.dayT / DAY_SECONDS, fill: '#9fbbe3', line: '#638ec6' };
    }
    put(c, ROW.land, land);
    if (past) { for (const r of [ROW.fit, ROW.hot, ROW.cold]) put(c, r, { t: '', box: true }); continue; }
    const rel = relation(sel, s.route[d]);
    put(c, ROW.fit, { t: REL_NAME[rel], a: 'c', box: true, fill: rel === 2 ? C_GOOD[0] : rel === 0 ? C_BAD[0] : null, color: rel === 2 ? C_GOOD[1] : rel === 0 ? C_BAD[1] : '#7f7f7f', f: `=适宜度("${CROPS[sel].name}", ${landCell(d)})  ' ${REL_NAME[rel]}` });
    const m = isM && s.markets[d];
    put(c, ROW.hot, m ? { t: CROPS[m.hot].name + ' ↑', a: 'c', box: true, fill: C_GOOD[0], color: C_GOOD[1], f: `=热销(${d})  ' ${CROPS[m.hot].name} ×2` } : { t: '', box: true });
    put(c, ROW.cold, m ? { t: CROPS[m.cold].name + ' ↓', a: 'c', box: true, fill: C_BAD[0], color: C_BAD[1], f: `=滞销(${d})  ' ${CROPS[m.cold].name} ×0.5` } : { t: '', box: true });
  }

  // 田：4 × 4 单元格。生长中 = 数据条（黄，受过伤变红），成熟 = 绿，枯萎 = 红
  put(0, ROW.fieldHead, { t: '地块', b: true, fill: HEAD_FILL, box: true });
  ['甲', '乙', '丙', '丁'].forEach((t, k) => put(COL.day0 + k, ROW.fieldHead, { t, a: 'c', b: true, fill: HEAD_FILL, box: true }));
  for (let y = 0; y < 4; y++) put(0, ROW.field0 + y, { t: `${y + 1} 垄`, fill: '#f2f2f2', box: true });
  const today = s.route[s.day];
  for (let i = 0; i < 16; i++) {
    const p = s.plots[i], { c, r } = fieldCell(i);
    if (!p) { put(c, r, { t: '', box: true, f: s.phase === 'end' ? '' : `=种植("${CROPS[sel].name}")  ' 进价 ${CROPS[sel].cost}` }); continue; }
    const C = CROPS[p.crop], need = 2 * C.days;
    if (p.withered) put(c, r, { t: C.name + ' 枯萎', fill: C_BAD[0], color: C_BAD[1], box: true, f: `=#N/A  ' ${C.name}已枯萎，点击清除` });
    else if (p.ripe) {
      const last = p.age === RIPE_WAIT - 1;
      put(c, r, { t: C.name + (last ? ' 快烂' : ' ✓'), b: true, fill: C_GOOD[0], color: last ? C_BAD[1] : C_GOOD[1], box: true, f: `=成熟("${C.name}")  ' 还能放 ${RIPE_WAIT - p.age} 天，点击收获` });
    } else {
      const hurt = p.harm > 0, rel = relation(p.crop, today);
      const harm = C.tough > 9 ? '不挑地形' : `受损 ${p.harm}/${C.tough + 1}`;

  else {
    const growing = state.plots.filter(p => p && !p.withered && !p.ripe);
    const avg = growing.length ? growing.reduce((a, p) => a + p.pts / (2 * CROPS[p.crop].days), 0) / growing.length : 0;
    right = `平均值: ${avg.toFixed(2)}    计数: ${state.plots.filter(Boolean).length}    求和: ${Math.round(dispCoins).toLocaleString('en-US')}`;
  }
  txt(right, W - 70, sy + 12, 12, '#fff', 'right');
}

function drawDialog(F) {
  const D = dialogRect(F), s = state, win = s.coins >= TARGET;
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(D.x + 3, D.y + 4, D.w, D.h);
  ctx.fillStyle = '#fff'; ctx.fillRect(D.x, D.y, D.w, D.h);
  ctx.strokeStyle = '#8c8c8c'; ctx.lineWidth = 1; ctx.strokeRect(D.x + 0.5, D.y + 0.5, D.w - 1, D.h - 1);
  txt('结算报告', D.x + 14, D.y + 18, 12, '#222');
  txt('✕', D.x + D.w - 18, D.y + 18, 12, '#666', 'center');
  const lines = [
    [`第 ${DAYS} 天已结束。余额 ${s.coins}，目标 ${TARGET}。`, '#222', 700],
    [win ? (s.coins >= TYCOON ? `超过 ${TYCOON}，富甲一方。` : '已达成目标。') : `未达成目标，还差 ${TARGET - s.coins}。`, win ? C_GOOD[1] : C_BAD[1], 400],
    [`收获 ${s.harvests}，损失 ${s.lost}${win && !s.lost ? '（一株也没浪费）' : ''}。`, '#444', 400],
  ];
  lines.forEach(([t, c, w], k) => txt(t, D.x + 20, D.y + 56 + k * 26, 13, c, 'left', w));
  const B = D.btn;
  ctx.fillStyle = '#e5f1e9'; ctx.fillRect(B.x, B.y, B.w, B.h);
  ctx.strokeStyle = '#217346'; ctx.strokeRect(B.x + 0.5, B.y + 0.5, B.w - 1, B.h - 1);
  txt('新建计划', B.x + B.w / 2, B.y + B.h / 2 + 1, 12, '#222', 'center');
}

function draw() {
  const F = frame(boss ? BOSS_W : COLW);
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  if (boss) {
    drawChrome(F, '2026 年农产品采购汇总（单位：千元）', 'A1');
    drawGrid(F, bossSheet(), { c: 0, r: 0 }, null);
  } else {
    const S = buildSheet(), o = S.get(active.c + ',' + active.r);
    drawChrome(F, o ? (o.f !== undefined ? o.f : o.t || '') : '', colName(active.c) + (active.r + 1));
    drawGrid(F, S, active, drag && drag.range);
  }
  drawStatus(F);
  if (!boss && state.phase === 'end' && endT > 0.3) drawDialog(F);
}

// ---------- 输入：Pointer Events；从一块地拖动会对经过的地重复同一动作 ----------
let drag = null;
function pointCell(e) { return cellAt(frame(), e.clientX, e.clientY); }
function actOnField(i, mode) {
  const p = state.plots[i];
  if (mode === 'plant' && !p) plant(i, state.selected);
  else if (mode === 'harvest' && p && (p.ripe || p.withered)) harvest(i);
}
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  const F = frame(), x = e.clientX, y = e.clientY;
  drag = null;
  const tab = tabAt(F, x, y);
  if (tab === 0 && boss) { toggleBoss(); return; }
  if (tab === 1 && !boss) { toggleBoss(); return; }
  if (boss) return;
  if (state.phase === 'end') {
    if (endT > 0.3 && inRect(x, y, dialogRect(F).btn)) newRound();
    return;
  }
  const cell = cellAt(F, x, y);
  if (!cell) return;
  const { c, r } = cell;
  active = cell;
  const i = fieldIndex(c, r);
  if (i >= 0) {
    const p = state.plots[i], mode = !p ? 'plant' : p.ripe || p.withered ? 'harvest' : null;
    if (mode) actOnField(i, mode);
    drag = { mode, last: i, range: { c0: c, r0: r, c1: c, r1: r }, start: cell };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有指针 */ }
    return;
  }
  if (r >= ROW.seed0 && r < ROW.seed0 + 8 && c >= COL.check && c <= COL.tough) { selectSeed(r - ROW.seed0); active = cell; return; }
  if (c === COL.act && r >= ROW.seed0 && r < ROW.seed0 + 8) { sell(r - ROW.seed0); return; }
  if (c === COL.act && r === ROW.total) { sellAll(); return; }
  if (c >= BTN.c && c < BTN.c + BTN.w && r >= BTN.r && r < BTN.r + BTN.h && isMarketDay()) { leaveMarket(); active = { c: BTN.c, r: BTN.r }; }
});
canvas.addEventListener('pointermove', e => {
  const cell = pointCell(e);
  if (drag && cell && !boss) {
    const i = fieldIndex(cell.c, cell.r);
    if (i >= 0 && i !== drag.last) {
      drag.last = i; active = cell;
      const s = drag.start;
      drag.range = { c0: Math.min(s.c, cell.c), r0: Math.min(s.r, cell.r), c1: Math.max(s.c, cell.c), r1: Math.max(s.r, cell.r) };
      if (drag.mode) actOnField(i, drag.mode);
    }
  }
  if (e.pointerType === 'mouse') {
    let pointer = false;
    if (cell && !boss && state.phase !== 'end') {
      const { c, r } = cell;
      pointer = (c === COL.act && r >= ROW.seed0 && r <= ROW.total && !!state.barn.concat([1])[r - ROW.seed0]) ||
        (c >= BTN.c && c < BTN.c + BTN.w && r >= BTN.r && r < BTN.r + BTN.h && isMarketDay());
    }
    canvas.style.cursor = pointer ? 'pointer' : 'cell';
  }
});
function release() { drag = null; }
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
window.addEventListener('blur', release);
window.addEventListener('keydown', e => {
  if (e.code === 'Escape') { e.preventDefault(); toggleBoss(); return; }
  if (e.code === 'KeyM') { muted = !muted; ensureAudio(); if (!boss) say(muted ? '声音：关' : '声音：开'); return; }
  if (boss) return;
  ensureAudio();
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.code === 'Enter' || e.code === 'NumpadEnter') {
    e.preventDefault();
    if (state.phase === 'end') { if (endT > 0.3) newRound(); }
    else leaveMarket();
  }
  else if (/^(Digit|Numpad)[1-8]$/.test(e.code)) selectSeed(Number(e.code.slice(-1)) - 1);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state.phase === 'play') state.paused = true; });

let lastT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0);
  lastT = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
newRound();
requestAnimationFrame(loop);

// 主站在水合后才监听消息，单发的 ready 可能丢；重复的 ready 主站会忽略。start 在第一次播种时才发。
function announce() { emitMoYuFunEvent('ready'); emitMoYuFunDisguise(APP, WINDOW_TITLE); }
announce();
for (const ms of [500, 2000, 5000]) setTimeout(announce, ms);
</script>
