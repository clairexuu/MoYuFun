export function groupBy<T, K extends string>(
  items: T[],
  keyOf: (item: T) => K,
): Record<K, T[]> {
  const groups = {} as Record<K, T[]>;
  for (const item of items) {
    const key = keyOf(item);
    if (groups[key] === undefined) {
      groups[key] = [];
    }
    groups[key].push(item);
  }
  return groups;
}

export function countBy<T>(items: T[], keyOf: (x: T) => string) {
  const counts: Record<string, number> = {};
  for (const item of items) {
    const key = keyOf(item);
    counts[key] = (counts[key] ?? 0) + 1;
  }
  return counts;
}

export function debounce<A extends unknown[]>(
  fn: (...args: A) => void,
  waitMs: number,
  options: { leading?: boolean } = {},
) {
  let timer: ReturnType<typeof setTimeout> | null = null;
  let lastCall = 0;

  function debounced(...args: A) {
    const now = Date.now();
    const isFirst = timer === null;
    if (timer !== null) {
      clearTimeout(timer);
    }
    if (options.leading && isFirst && now - lastCall > waitMs) {
      fn(...args);
    }
    lastCall = now;
    timer = setTimeout(() => {
      timer = null;
      if (!options.leading) fn(...args);
    }, waitMs);
  }

  debounced.cancel = () => {
    if (timer) clearTimeout(timer);
    timer = null;
  };
  return debounced;
}

export async function retry<T>(
  task: (attempt: number) => Promise<T>,
  { retries = 3, baseMs = 200, maxMs = 5000 } = {},
): Promise<T> {
  let lastError: unknown = null;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      return await task(attempt);
    } catch (err) {
      lastError = err;
      if (attempt === retries) break;
      const jitter = Math.random() * baseMs;
      const delay = Math.min(maxMs, baseMs * 2 ** attempt);
      await sleep(delay + jitter);
    }
  }
  throw lastError;
}

function sleep(ms: number) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

export function isRetryable(status: number) {
  return status === 429 || (status >= 500 && status !== 501);
}

const UNITS = ['B', 'KB', 'MB', 'GB', 'TB'];

export function formatBytes(bytes: number, decimals = 1) {
  if (!Number.isFinite(bytes) || bytes < 0) {
    return '-';
  }
  if (bytes === 0) return '0 B';
  const base = 1024;
  const exp = Math.min(
    Math.floor(Math.log(bytes) / Math.log(base)),
    UNITS.length - 1,
  );
  const value = bytes / base ** exp;
  const fixed = exp === 0 ? 0 : decimals;
  return `${value.toFixed(fixed)} ${UNITS[exp]}`;
}

export function parseBytes(text: string): number | null {
  const match = /^([\d.]+)\s*([KMGT]?B)$/i.exec(text.trim());
  if (!match) return null;
  const exp = UNITS.indexOf(match[2].toUpperCase());
  if (exp < 0) return null;
  return Math.round(parseFloat(match[1]) * 1024 ** exp);
}

const SEPARATORS = /[\s_.]+/g;

export function slugify(input: string, maxLength = 60): string {
  const base = input
    .normalize('NFKD')
    .replace(SEPARATORS, '-')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
  if (base.length <= maxLength) {
    return base;
  }
  const cut = base.slice(0, maxLength);
  const lastDash = cut.lastIndexOf('-');
  return lastDash > 20 ? cut.slice(0, lastDash) : cut;
}

export function uniqueSlug(title: string, taken: Set<string>) {
  const base = slugify(title);
  let slug = base;
  let n = 2;
  while (taken.has(slug)) {
    slug = `${base}-${n}`;
    n += 1;
  }
  taken.add(slug);
  return slug;
}

export function parseQuery(search: string) {
  const result: Record<string, string | string[]> = {};
  const query = search.startsWith('?') ? search.slice(1) : search;
  if (query.length === 0) return result;
  for (const part of query.split('&')) {
    if (!part) continue;
    const eq = part.indexOf('=');
    const rawKey = eq === -1 ? part : part.slice(0, eq);
    const rawVal = eq === -1 ? '' : part.slice(eq + 1);
    const key = decodeURIComponent(rawKey.replace(/\+/g, ' '));
    const value = decodeURIComponent(rawVal.replace(/\+/g, ' '));
    const prev = result[key];
    if (prev === undefined) {
      result[key] = value;
    } else if (Array.isArray(prev)) {
      prev.push(value);
    } else {
      result[key] = [prev, value];
    }
  }
  return result;
}

export function toQuery(params: Record<string, string | number>) {
  return Object.keys(params)
    .filter((key) => params[key] !== '')
    .map((key) => `${key}=${encodeURIComponent(params[key])}`)
    .join('&');
}

export function useDebouncedValue<T>(value: T, delayMs = 300) {
  const [debounced, setDebounced] = useState(value);
  const first = useRef(true);

  useEffect(() => {
    if (first.current) {
      first.current = false;
      return;
    }
    const id = setTimeout(() => setDebounced(value), delayMs);
    return () => clearTimeout(id);
  }, [value, delayMs]);

  return debounced;
}

export function useThrottle<T>(value: T, intervalMs = 500) {
  const [shown, setShown] = useState(value);
  const lastRun = useRef(Date.now());

  useEffect(() => {
    const elapsed = Date.now() - lastRun.current;
    const wait = Math.max(0, intervalMs - elapsed);
    const id = setTimeout(() => {
      lastRun.current = Date.now();
      setShown(value);
    }, wait);
    return () => clearTimeout(id);
  }, [value, intervalMs]);

  return shown;
}

export function useLocalStorage<T>(key: string, initial: T) {
  const [value, setValue] = useState<T>(() => {
    if (typeof window === 'undefined') return initial;
    try {
      const raw = window.localStorage.getItem(key);
      return raw !== null ? (JSON.parse(raw) as T) : initial;
    } catch {
      return initial;
    }
  });

  const update = useCallback(
    (next: T | ((prev: T) => T)) => {
      setValue((prev) => {
        const resolved =
          next instanceof Function ? next(prev) : next;
        try {
          const json = JSON.stringify(resolved);
          window.localStorage.setItem(key, json);
        } catch {
          // quota exceeded or private mode: keep it in memory
        }
        return resolved;
      });
    },
    [key],
  );

  return [value, update] as const;
}

export function usePagination(total: number, pageSize = 20) {
  const [page, setPage] = useState(1);
  const pageCount = Math.max(1, Math.ceil(total / pageSize));

  useEffect(() => {
    if (page > pageCount) setPage(pageCount);
  }, [page, pageCount]);

  const range = useMemo(() => {
    const start = (page - 1) * pageSize;
    const end = Math.min(start + pageSize, total);
    return { start, end };
  }, [page, pageSize, total]);

  const pages = useMemo(() => {
    const out: number[] = [];
    const from = Math.max(1, page - 2);
    const to = Math.min(pageCount, page + 2);
    for (let p = from; p <= to; p++) out.push(p);
    return out;
  }, [page, pageCount]);

  return {
    page,
    pageCount,
    range,
    pages,
    hasPrev: page > 1,
    hasNext: page < pageCount,
    next: () => setPage((p) => Math.min(p + 1, pageCount)),
    prev: () => setPage((p) => Math.max(p - 1, 1)),
  };
}

export function useInterval(
  callback: () => void,
  delay: number | null,
) {
  const saved = useRef(callback);

  useLayoutEffect(() => {
    saved.current = callback;
  }, [callback]);

  useEffect(() => {
    if (delay === null || delay < 0) return;
    const id = setInterval(() => saved.current(), delay);
    return () => clearInterval(id);
  }, [delay]);
}

export function useCountdown(seconds: number, running: boolean) {
  const [left, setLeft] = useState(seconds);

  useEffect(() => setLeft(seconds), [seconds]);

  useInterval(
    () => setLeft((s) => (s > 0 ? s - 1 : 0)),
    running && left > 0 ? 1000 : null,
  );

  const minutes = Math.floor(left / 60);
  const rest = String(left % 60).padStart(2, '0');
  return { left, label: `${minutes}:${rest}`, done: left === 0 };
}

type FetchState<T> =
  | { status: 'idle' | 'loading' }
  | { status: 'success'; data: T }
  | { status: 'error'; error: Error };

export function useFetchJson<T>(url: string | null) {
  const [state, setState] = useState<FetchState<T>>({
    status: 'idle',
  });

  useEffect(() => {
    if (!url) return;
    const controller = new AbortController();
    setState({ status: 'loading' });
    fetch(url, { signal: controller.signal })
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json() as Promise<T>;
      })
      .then((data) => setState({ status: 'success', data }))
      .catch((error) => {
        if (controller.signal.aborted) return;
        setState({ status: 'error', error });
      });
    return () => controller.abort();
  }, [url]);

  return state;
}

type Filter = {
  status?: string[];
  minTotal?: number;
  since?: Date;
  search?: string;
};

export function buildWhere(filter: Filter) {
  const clauses: string[] = [];
  const params: unknown[] = [];
  const add = (sql: string, value: unknown) => {
    params.push(value);
    clauses.push(sql.replace('?', `$${params.length}`));
  };

  if (filter.status && filter.status.length > 0) {
    add('status = any(?)', filter.status);
  }
  if (filter.minTotal !== undefined) {
    add('total >= ?', filter.minTotal);
  }
  if (filter.since) {
    add('created_at >= ?', filter.since.toISOString());
  }
  if (filter.search?.trim()) {
    add('customer_name ilike ?', `%${filter.search.trim()}%`);
  }
  if (clauses.length === 0) return { where: '', params };
  return { where: `where ${clauses.join(' and ')}`, params };
}

export function buildInsert(
  table: string,
  rows: Record<string, unknown>[],
) {
  if (rows.length === 0) {
    throw new Error('buildInsert: no rows');
  }
  const columns = Object.keys(rows[0]).sort();
  const params: unknown[] = [];
  const tuples = rows.map((row, r) => {
    const missing = columns.filter((c) => !(c in row));
    if (missing.length > 0) {
      throw new Error(`row ${r} lacks ${missing.join(', ')}`);
    }
    const slots = columns.map((c) => {
      params.push(row[c] ?? null);
      return `$${params.length}`;
    });
    return `(${slots.join(', ')})`;
  });
  const quoted = columns.map((c) => `"${c}"`).join(', ');
  const values = tuples.join(', ');
  return {
    text: `insert into ${table} (${quoted}) values ${values}`,
    params,
  };
}

const SORTABLE = new Set(['created_at', 'total', 'customer']);

export function buildPagedQuery(opts: {
  table: string;
  sort?: string;
  desc?: boolean;
  page?: number;
  pageSize?: number;
}) {
  const wanted = opts.sort ?? '';
  const sort = SORTABLE.has(wanted) ? wanted : 'created_at';
  const direction = opts.desc === false ? 'asc' : 'desc';
  const size = opts.pageSize ?? 25;
  const pageSize = Math.min(Math.max(size, 1), 100);
  const page = Math.max(opts.page ?? 1, 1);
  const offset = (page - 1) * pageSize;
  const lines = [
    `select * from ${opts.table}`,
    `order by ${sort} ${direction}, id ${direction}`,
    `limit ${pageSize + 1} offset ${offset}`,
  ];
  return { text: lines.join('\n'), pageSize, offset };
}

export function splitPage<T>(rows: T[], pageSize: number) {
  const hasMore = rows.length > pageSize;
  return {
    items: hasMore ? rows.slice(0, pageSize) : rows,
    hasMore,
  };
}

export function buildUpsert(
  table: string,
  row: Record<string, unknown>,
  conflictKeys: string[],
) {
  const columns = Object.keys(row);
  for (const key of conflictKeys) {
    if (!columns.includes(key)) {
      throw new Error(`conflict key ${key} is not in row`);
    }
  }
  const slots = columns.map((_, i) => `$${i + 1}`);
  const updates = columns
    .filter((c) => !conflictKeys.includes(c))
    .map((c) => `${c} = excluded.${c}`);
  const action = updates.length
    ? `do update set ${updates.join(', ')}`
    : 'do nothing';
  const text = [
    `insert into ${table} (${columns.join(', ')})`,
    `values (${slots.join(', ')})`,
    `on conflict (${conflictKeys.join(', ')}) ${action}`,
    'returning *',
  ].join(' ');
  return { text, values: columns.map((c) => row[c]) };
}

const HOLIDAYS = new Set([
  '2026-01-01',
  '2026-10-01',
  '2026-10-02',
]);

function isoDay(d: Date) {
  return d.toISOString().slice(0, 10);
}

export function isBusinessDay(d: Date) {
  const day = d.getDay();
  return day !== 0 && day !== 6 && !HOLIDAYS.has(isoDay(d));
}

export function addBusinessDays(start: Date, days: number) {
  const result = new Date(start.getTime());
  const step = days < 0 ? -1 : 1;
  let left = Math.abs(days);
  while (left > 0) {
    result.setDate(result.getDate() + step);
    if (isBusinessDay(result)) {
      left -= 1;
    }
  }
  return result;
}

export function businessDaysBetween(a: Date, b: Date) {
  let count = 0;
  const cursor = new Date(a.getTime());
  while (cursor < b) {
    if (isBusinessDay(cursor)) count++;
    cursor.setDate(cursor.getDate() + 1);
  }
  return count;
}

const MS_PER_DAY = 24 * 60 * 60 * 1000;

export function startOfDay(d: Date) {
  const copy = new Date(d);
  copy.setHours(0, 0, 0, 0);
  return copy;
}

export function daysBetween(from: Date, to: Date) {
  const a = startOfDay(from).getTime();
  const b = startOfDay(to).getTime();
  return Math.round((b - a) / MS_PER_DAY);
}

export function ageInYears(birth: Date, today = new Date()) {
  let age = today.getFullYear() - birth.getFullYear();
  const beforeBirthday =
    today.getMonth() < birth.getMonth() ||
    (today.getMonth() === birth.getMonth() &&
      today.getDate() < birth.getDate());
  if (beforeBirthday) age -= 1;
  return age;
}

export function isSameMonth(a: Date, b: Date) {
  return (
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth()
  );
}

export function isoWeek(date: Date) {
  const d = new Date(
    Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()),
  );
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const diff = d.getTime() - yearStart.getTime();
  const week = Math.ceil((diff / 86400000 + 1) / 7);
  return { year: d.getUTCFullYear(), week };
}

export function startOfWeek(date: Date, weekStartsOn = 1) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day - weekStartsOn + 7) % 7;
  d.setDate(d.getDate() - diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

export function weekLabel(date: Date) {
  const { year, week } = isoWeek(date);
  return `${year}-W${String(week).padStart(2, '0')}`;
}

export function formatDuration(ms: number, short = false) {
  if (ms < 0) return '-' + formatDuration(-ms, short);
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  if (short) {
    const mm = String(minutes).padStart(2, '0');
    const ss = String(seconds).padStart(2, '0');
    if (hours > 0) return `${hours}:${mm}:${ss}`;
    return `${minutes}:${ss}`;
  }
  const parts: string[] = [];
  if (hours > 0) parts.push(`${hours}h`);
  if (minutes > 0) parts.push(`${minutes}m`);
  if (seconds > 0 || parts.length === 0) {
    parts.push(`${seconds}s`);
  }
  return parts.join(' ');
}

export function parseDuration(text: string) {
  let total = 0;
  for (const [, n, unit] of text.matchAll(/(\d+)\s*([hms])/g)) {
    const factor = unit === 'h' ? 3600 : unit === 'm' ? 60 : 1;
    total += Number(n) * factor * 1000;
  }
  return total;
}

export function quarterOf(date: Date) {
  return Math.floor(date.getMonth() / 3) + 1;
}

export function quarterRange(year: number, quarter: number) {
  if (quarter < 1 || quarter > 4) {
    throw new RangeError(`invalid quarter ${quarter}`);
  }
  const firstMonth = (quarter - 1) * 3;
  const start = new Date(year, firstMonth, 1);
  const end = new Date(year, firstMonth + 3, 0, 23, 59, 59);
  return { start, end };
}

export function fiscalYear(date: Date, startMonth = 4) {
  const month = date.getMonth() + 1;
  return month >= startMonth
    ? date.getFullYear()
    : date.getFullYear() - 1;
}

export function monthsBetween(from: Date, to: Date) {
  const years = to.getFullYear() - from.getFullYear();
  const months = to.getMonth() - from.getMonth();
  const partial = to.getDate() < from.getDate() ? 1 : 0;
  return years * 12 + months - partial;
}

type Order = {
  id: string;
  region: string;
  amount: number;
  status: 'paid' | 'refunded' | 'pending';
  paidAt: Date | null;
};

export function summarizeOrders(orders: Order[], area = '') {
  const rows = orders.filter(
    (o) => o.status === 'paid' && (!area || o.region === area),
  );
  let total = 0;
  let largest: Order | null = null;
  const byMonth = new Map<string, number>();
  for (const order of rows) {
    total += order.amount;
    if (!largest || order.amount > largest.amount) {
      largest = order;
    }
    const month = order.paidAt?.toISOString().slice(0, 7) ?? '-';
    byMonth.set(month, (byMonth.get(month) ?? 0) + order.amount);
  }
  const average = rows.length > 0 ? total / rows.length : 0;
  return {
    count: rows.length,
    total: Math.round(total * 100) / 100,
    average: Math.round(average * 100) / 100,
    largestId: largest?.id ?? null,
    byMonth: Object.fromEntries(byMonth),
  };
}

type LineItem = { sku: string; qty: number; unitPrice: number };
type Coupon = { kind: 'percent' | 'fixed'; value: number };

export function invoiceTotal(
  items: LineItem[],
  coupon: Coupon | null,
  taxRate = 0.13,
) {
  const subtotal = items.reduce(
    (sum, item) => sum + item.qty * item.unitPrice,
    0,
  );
  let discount = 0;
  if (coupon !== null) {
    discount =
      coupon.kind === 'percent'
        ? (subtotal * coupon.value) / 100
        : coupon.value;
  }
  discount = Math.min(discount, subtotal);
  const taxable = subtotal - discount;
  const tax = Math.round(taxable * taxRate * 100) / 100;
  return {
    subtotal,
    discount,
    tax,
    total: taxable + tax,
    freeShipping: taxable >= 99,
  };
}

export class LruCache<K, V> {
  private map = new Map<K, V>();

  constructor(private readonly capacity = 100) {
    if (capacity < 1) {
      throw new RangeError('capacity must be at least 1');
    }
  }

  get(key: K): V | undefined {
    if (!this.map.has(key)) return undefined;
    const value = this.map.get(key) as V;
    this.map.delete(key);
    this.map.set(key, value);
    return value;
  }

  set(key: K, value: V) {
    if (this.map.has(key)) {
      this.map.delete(key);
    } else if (this.map.size >= this.capacity) {
      const oldest = this.map.keys().next().value as K;
      this.map.delete(oldest);
    }
    this.map.set(key, value);
    return this;
  }

  get size() {
    return this.map.size;
  }
}

export function lowerBound<T>(
  items: readonly T[],
  target: T,
  compare: (a: T, b: T) => number,
) {
  let lo = 0;
  let hi = items.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (compare(items[mid], target) < 0) {
      lo = mid + 1;
    } else {
      hi = mid;
    }
  }
  return lo;
}

export function sortedInsert<T>(
  items: T[],
  value: T,
  compare: (a: T, b: T) => number,
) {
  const index = lowerBound(items, value, compare);
  items.splice(index, 0, value);
  return index;
}

export function includesSorted(xs: number[], x: number) {
  const i = lowerBound(xs, x, (a, b) => a - b);
  return i < xs.length && xs[i] === x;
}

document.title = TITLE;
// 主站在水合后才监听消息，单发的 ready 可能丢；重复的 ready 和 disguise 主站会忽略。start 在第一次点代码时才发。
function announce() { emitMoYuFunEvent('ready'); emitMoYuFunDisguise(APP, TITLE); }
announce();
for (const ms of [500, 2000, 5000]) setTimeout(announce, ms);
let lastFrame = null;
function frame(now) {
  const dt = lastFrame === null ? 0 : Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
