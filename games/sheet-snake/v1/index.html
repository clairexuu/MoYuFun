let AC = null, master = null, muted = true;
function ensureAudio() {
  if (!AC) {
    try {

function tone(f0, f1, dur, type, vol) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 1, t);

  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}

// ---------- 随机数（测试里替换成固定种子） ----------
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;

// ---------- 规则（纯函数，只改传入的 g，随机只走 rng） ----------
function intervalFor(eaten) { return Math.max(MIN_INTERVAL, START_INTERVAL - SPEEDUP * eaten); }
function bonusPoints(b) { return 20 + 5 * Math.ceil(b.ttl); }
function newGame(cols, rows) {
  const x = Math.floor(cols / 2), y = Math.floor(rows / 2);
  const g = {
    cols, rows, snake: [{ x, y }, { x: x - 1, y }, { x: x - 2, y }], dir: { x: 1, y: 0 }, queue: [],
    food: null, bonus: null, score: 0, eaten: 0, bonusEaten: 0, gain: 0,
    interval: START_INTERVAL, acc: 0, t: 0, state: 'ready', cause: null,
  };
  g.food = freeCell(g);
  return g;
}
// 随机挑一个不在蛇身、食物、奖励上的格子；满了返回 null。
function freeCell(g) {
  const taken = new Set(g.snake.map(s => s.y * g.cols + s.x));
  for (const c of [g.food, g.bonus]) if (c) taken.add(c.y * g.cols + c.x);
  const free = [];
  for (let i = 0; i < g.cols * g.rows; i++) if (!taken.has(i)) free.push(i);
  if (!free.length) return null;
  const i = free[Math.floor(rng() * free.length)];
  return { x: i % g.cols, y: Math.floor(i / g.cols) };
}
// 排队转向，最多 3 个。不能原地掉头；开局前掉头就把整条蛇反过来。
function turn(g, x, y) {
  const last = g.queue.length ? g.queue[g.queue.length - 1] : g.dir;
  if (last.x === x && last.y === y) return false;
  if (last.x === -x && last.y === -y) {
    if (g.state !== 'ready') return false;
    g.snake.reverse(); g.dir = { x, y }; g.queue = [];
    return true;
  }
  if (g.queue.length >= 3) return false;
  g.queue.push({ x, y });
  return true;
}
// 走一格。返回 'move' | 'eat' | 'bonus' | 'wall' | 'self' | 'full'（吃完后整张表没空格了）。
function step(g) {
  if (g.queue.length) g.dir = g.queue.shift();
  const h = { x: g.snake[0].x + g.dir.x, y: g.snake[0].y + g.dir.y };
  if (h.x < 0 || h.y < 0 || h.x >= g.cols || h.y >= g.rows) return 'wall';
  // 尾巴这一步会挪走，不算撞到；吃到东西时尾巴不动，但食物本来就不在蛇身上。
  if (g.snake.slice(0, -1).some(s => s.x === h.x && s.y === h.y)) return 'self';
  g.snake.unshift(h);
  const at = c => c && c.x === h.x && c.y === h.y;
  let ev;
  if (at(g.bonus)) {
    g.gain = bonusPoints(g.bonus); g.score += g.gain; g.bonusEaten++; g.bonus = null; ev = 'bonus';
  } else if (at(g.food)) {
    g.gain = FOOD_POINTS; g.score += g.gain; g.eaten++; g.interval = intervalFor(g.eaten); g.food = null; ev = 'eat';
    if (g.eaten % BONUS_EVERY === 0 && !g.bonus) {
      const c = freeCell(g);
      if (c) g.bonus = { x: c.x, y: c.y, ttl: BONUS_TTL };
    }
  } else {
    g.snake.pop();
    return 'move';
  }
  if (!g.food) g.food = freeCell(g);
  return g.food || g.bonus ? ev : 'full';
}

// 按当前 ctx.font 截断到 maxW 像素宽，末尾加 tail。

    (cx, cy) => { ctx.moveTo(cx - 5, cy - 4.5); ctx.lineTo(cx - 5, cy + 4.5); ctx.moveTo(cx + 6, cy - 0.5); ctx.quadraticCurveTo(cx + 6, cy + 4, cx - 5, cy + 5);

    (cx, cy) => { ctx.rect(cx - 8.5, cy - 1.5, 7, 7); ctx.rect(cx - 1.5, cy - 1.5, 7, 7); ctx.rect(cx - 8.5, cy + 5.5, 7, 7); ctx.rect(cx + 1.5, cy - 9.5, 7, 7); },

  if (/^[A-Z][A-Z0-9_]+$/.test(t)) return '#4fc1ff';
  if (/^[A-Z]/.test(t)) return '#4ec9b0';
  if (/^[A-Za-z_$]/.test(t)) return next === '(' || next === '<' ? '#dcdcaa' : '#9cdcfe';
  return '#d4d4d4';
}
function drawCodeLine(ctx, line, x, y, chw) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let col = 0;
  for (const m of line.matchAll(/\/\/.*|'[^']*'|\d+|[A-Za-z_$][\w$]*|\s+|./g)) {
    const t = m[0];
    if (t.trim()) { ctx.fillStyle = tokenColor(t, line[m.index + t.length]); ctx.fillText(t, x + col * chw, y); }
    col += t.length;
  }
}
function drawSquiggle(ctx, x, y, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i <= w; i += 2) ctx[i ? 'lineTo' : 'moveTo'](x + i, y + (i % 4 ? -1.5 : 1.5));
  ctx.stroke();
}
function drawCaret(ctx, x, y, h) { ctx.fillStyle = '#aeafad'; ctx.fillRect(Math.round(x), y + 1, 2, h - 2); }

// ---------- 画布与布局 ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, dpr: 1 };
ctx.font = `${VS.fontSize}px ${VS.mono}`;
const CHAR_W = ctx.measureText('m').width || 7.8;   // 13 px 等线字体的字宽
function layoutBox() { return { x: 0, y: 0, w: view.w, h: view.h }; }
// 每局开始时按当前窗口定下网格大小，整局不变（中途缩放只拉伸格子）。
function gridSize(s, box) {
  if (s === 'excel') {
    const r = excelContentRect(box);
    return { cols: clamp(Math.floor(r.w / 72), 8, 26), rows: clamp(Math.floor(r.h / 22), 8, 30) };
  }
  const r = vscodeContentRect(box);
  return { cols: clamp(Math.floor(r.w / (2 * CHAR_W)), 12, 40), rows: clamp(Math.floor(r.h / VS.lineH), 8, CODE.length) };
}
// VS Code 里一格 = 两个字符宽、一行高；放不下时整体等比缩小字号。
function codeMetrics(rect, cols, rows) {
  const s = Math.min(1, rect.w / (cols * 2 * CHAR_W), rect.h / (rows * VS.lineH));
  return { font: VS.fontSize * s, chw: CHAR_W * s, cw: 2 * CHAR_W * s, lh: VS.lineH * s };
}
// 用 clientWidth 而不是 innerWidth：手机上画布一旦过宽，innerWidth 会被撑大。
function resize() {
  view.dpr = window.devicePixelRatio || 1;
  view.w = document.documentElement.clientWidth;
  view.h = document.documentElement.clientHeight;
  canvas.width = Math.round(view.w * view.dpr);
  canvas.height = Math.round(view.h * view.dpr);
  canvas.style.width = view.w + 'px';
  canvas.style.height = view.h + 'px';
  if (g && g.state === 'ready' && !boss) reset();   // 还没开始就按新尺寸重排（伪装模式切换会改 iframe 大小）
}

// ---------- 局面流程 ----------
let skin = loadSkin(), g = null, best = 0, boss = false, paused = false, flashes = [], termLog = [];
function loadSkin() {
  try { return localStorage.getItem(SKIN_KEY) === 'vscode' ? 'vscode' : 'excel'; } catch (err) { return 'excel'; }
}
function setSkin(s) {
  skin = s;
  try { localStorage.setItem(SKIN_KEY, s); } catch (err) { /* 存不了就算了 */ }
  document.title = SKINS[s].title;
  emitMoYuFunDisguise(SKINS[s].app, SKINS[s].title);
  if (g.state === 'ready' && !boss) reset();
}
function reset() {
  const { cols, rows } = gridSize(skin, layoutBox());
  g = newGame(cols, rows);
  roundAchievements = new Set(); paused = false; flashes = []; termLog = [];
}
// 一次真实操作：方向键 / 滑动（带方向）或空格 / 轻点（不带方向）。开局时发 start，暂停时继续。
function act(x, y) {
  if (boss || g.state === 'over') return;
  if (x !== undefined) turn(g, x, y);
  paused = false;
  if (g.state === 'ready') { g.state = 'play'; emitMoYuFunEvent('start'); }
}
function toggleBoss() {
  boss = !boss;
  if (!boss && g.state === 'play') paused = true;   // 回来后等一个方向键再走，免得一露面就撞墙
}
function update(dt) {
  for (const f of flashes) f.t -= dt;
  flashes = flashes.filter(f => f.t > 0);
  if (g.state !== 'play' || paused || boss) return;
  g.t += dt;
  if (g.bonus && (g.bonus.ttl -= dt) <= 0) { g.bonus = null; if (!g.food) g.food = freeCell(g); }
  g.acc += dt;
  while (g.state === 'play' && g.acc >= g.interval) { g.acc -= g.interval; onStep(step(g)); }
}
function onStep(ev) {
  if (ev === 'move') return;
  if (ev === 'wall' || ev === 'self') { endRound(ev); return; }
  const h = g.snake[0];
  flashes.push({ x: h.x, y: h.y, t: FLASH_T });
  termLog.push(` ✓ ${TEST_NAMES[(g.eaten + g.bonusEaten) % TEST_NAMES.length]} (${g.gain} ms)`);
  if (termLog.length > 40) termLog.shift();
  if (ev === 'bonus') tone(880, 1320, 0.12, 'triangle', 0.5); else tone(660, 880, 0.05, 'square', 0.3);
  if (g.snake.length >= 10) unlockAchievement('len_10');
  if (g.snake.length >= 30) unlockAchievement('len_30');
  if (g.bonusEaten >= 3) unlockAchievement('bonus_3');
  if (g.interval === MIN_INTERVAL) unlockAchievement('full_speed');
  if (g.score >= 500) unlockAchievement('score_500');
  if (ev === 'full') endRound('full');
}
function endRound(cause) {
  g.state = 'over'; g.cause = cause; best = Math.max(best, g.score);
  if (cause !== 'full') tone(220, 70, 0.35, 'sawtooth', 0.4);
  emitMoYuFunStats({ rounds: 1, foods: g.eaten + g.bonusEaten, bonus: g.bonusEaten });
  emitMoYuFunEvent('end');
}

// ---------- 伪装文字（状态栏、编辑栏、终端；老板键时不带任何游戏信息） ----------
const num = n => n.toLocaleString('en-US');
function excelTexts() {
  if (boss) return { nameBox: 'A1', formula: SHEET[0][0], statusLeft: '就绪', statusRight: [] };
  const h = g.snake[0], tail = g.snake[g.snake.length - 1], addr = excelColName(h.x) + (h.y + 1);
  const over = g.state === 'over', broken = over && g.cause !== 'full';
  let statusLeft = '就绪';
  if (g.state === 'ready') statusLeft = '就绪    方向键开始 · F2 切换视图 · Esc 隐藏';
  else if (over) statusLeft = { wall: '公式引用无效', self: '循环引用: ' + addr, full: '已填满整个区域' }[g.cause] + '    按空格重算';
  else if (paused) statusLeft = '就绪    已暂停，方向键继续';
  return {
    nameBox: addr,
    formula: broken ? '=SUM(#REF!)' : `=SUM(${excelColName(tail.x)}${tail.y + 1}:${addr})`,
    statusLeft,
    statusRight: [`平均值: ${(g.score / g.snake.length).toFixed(2)}`, `计数: ${g.snake.length}`,
      `最大值: ${num(Math.max(best, g.score))}`, `求和: ${num(g.score)}`],
  };
}
function vscodeTexts() {
  const dim = '#8b8b8b', green = '#89d185', red = VS.error;
  if (boss) {
    return { errors: 0, warnings: 0, terminal: [
      { text: '$ pnpm dev' }, { text: '> moyufun-admin@1.4.2 dev' },
      { text: ' ✓ Ready in 1.8s', color: green }, { text: '   Local:   http://localhost:3000', color: dim },
    ] };
  }
  const h = g.snake[0], n = g.eaten + g.bonusEaten, over = g.state === 'over';
  const lines = [{ text: '$ pnpm test --watch' }].concat(termLog.map(text => ({ text, color: green })));
  if (g.state === 'ready') lines.push({ text: 'Watch Usage: 方向键开始 · F2 切换视图 · Esc 隐藏', color: dim });
  if (over && g.cause === 'wall') lines.push({ text: "TypeError: Cannot read properties of undefined (reading 'x')", color: red });
  if (over && g.cause === 'self') lines.push({ text: 'RangeError: Maximum call stack size exceeded', color: red });
  if (over && g.cause !== 'full') lines.push({ text: `    at summarize (src/services/report.service.ts:${h.y + 1}:${h.x * 2 + 1})`, color: red });
  lines.push({ text: `Tests:  ${n} passed, ${n} total    (最佳 ${Math.max(best, g.score)})`, color: dim });
  if (over) lines.push({ text: '按空格重新运行', color: dim });
  else if (paused) lines.push({ text: '已暂停，方向键继续', color: dim });
  return { errors: over && g.cause !== 'full' ? 1 : 0, warnings: g.score, terminal: lines };
}

// ---------- 画面 ----------
function drawExcelGame(box, now) {
  const rect = excelContentRect(box), { cols, rows } = g, show = !boss, t = excelTexts();
  const head = g.snake[0], sel = show ? head : { x: 0, y: 0 }, dead = show && g.state === 'over' && g.cause !== 'full';
  drawExcelChrome(ctx, box, { title: SKINS.excel.title, nameBox: t.nameBox, formula: t.formula,
    statusLeft: t.statusLeft, statusRight: t.statusRight, cols, rows, selCol: sel.x, selRow: sel.y,
    sheets: ['汇总', '明细', 'Q3对账'], activeSheet: 0 });
  drawExcelGridlines(ctx, rect, cols, rows);
  const body = new Map();
  if (show) g.snake.forEach((s, i) => body.set(s.y * cols + s.x, i));
  const bonusOff = g.bonus && g.bonus.ttl < 2 && Math.floor(now / 160) % 2;   // 快过期时闪烁
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const r = excelCellRect(rect, cols, rows, x, y), i = body.get(y * cols + x);
    let text = (SHEET[y] || [])[x] || '', fmt = { bold: y === 0, align: y === 0 ? 'center' : undefined };
    if (i !== undefined) fmt = { ...fmt, ...(dead && i === 0 ? XL_FORMAT.bad : XL_FORMAT.good) };
    else if (show && g.food && g.food.x === x && g.food.y === y) fmt = { ...fmt, ...XL_FORMAT.bad };
    else if (show && g.bonus && g.bonus.x === x && g.bonus.y === y) { text = String(bonusPoints(g.bonus)); if (!bonusOff) fmt = { ...XL_FORMAT.neutral, align: 'right' }; }
    if (dead && i === 0) text = '#REF!';
    drawExcelCell(ctx, r, text, fmt);
  }
  if (show) for (const f of flashes) {
    const r = excelCellRect(rect, cols, rows, f.x, f.y);
    ctx.fillStyle = `rgba(33,115,70,${0.35 * f.t / FLASH_T})`; ctx.fillRect(r.x, r.y, r.w, r.h);
  }
  const sr = excelCellRect(rect, cols, rows, sel.x, sel.y);
  drawExcelSelection(ctx, sr);
  if (dead) drawExcelErrorMark(ctx, sr);
}
function drawVSCodeGame(box, now) {
  const rect = vscodeContentRect(box), m = codeMetrics(rect, g.cols, g.rows), show = !boss, t = vscodeTexts();
  const head = g.snake[0], cur = show ? head : { x: 0, y: 0 }, dead = show && g.state === 'over' && g.cause !== 'full';
  drawVSCodeChrome(ctx, box, { title: SKINS.vscode.title, project: 'MOYUFUN-ADMIN', files: VS_FILES, tabs: VS_TABS,
    crumbs: ['src', 'services', 'report.service.ts', 'summarize'], lineCount: g.rows, lineHeight: m.lh, fontSize: m.font,
    cursorLine: cur.y, problems: t.errors + t.warnings, terminal: t.terminal,
    status: { branch: 'main', errors: t.errors, warnings: t.warnings, line: cur.y + 1, col: cur.x * 2 + 1, language: 'TypeScript' } });
  const cell = c => ({ x: rect.x + c.x * m.cw, y: rect.y + c.y * m.lh });
  vline(ctx, Math.round(rect.x + g.cols * m.cw), rect.y - 4, rect.y + rect.h, '#3b3b3b');   // 第 80 列标尺 = 右墙
  if (show) g.snake.forEach((s, i) => {
    const p = cell(s);
    ctx.fillStyle = dead && i === 0 ? '#5a1d1d' : i ? VS.selection : '#2f6aa8';
    ctx.fillRect(p.x, p.y, m.cw, m.lh);
  });
  ctx.font = `${m.font}px ${VS.mono}`;
  for (let i = 0; i < g.rows; i++) drawCodeLine(ctx, CODE[i] || '', rect.x, rect.y + i * m.lh + m.lh / 2, m.chw);
  if (show) {
    const under = (c, color) => { const p = cell(c); drawSquiggle(ctx, p.x, p.y + m.lh - 2, m.cw, color); };
    if (g.food) under(g.food, VS.error);
    if (g.bonus && !(g.bonus.ttl < 2 && Math.floor(now / 160) % 2)) under(g.bonus, VS.warning);
    if (dead) under(head, VS.error);
    for (const f of flashes) { const p = cell(f); ctx.fillStyle = `rgba(255,255,255,${0.2 * f.t / FLASH_T})`; ctx.fillRect(p.x, p.y, m.cw, m.lh); }
  }
  if (g.state !== 'play' || paused || boss || Math.floor(now / 530) % 2 === 0) {
    const p = cell(cur);
    drawCaret(ctx, p.x + (show && g.dir.x > 0 ? m.cw - 2 : 0), p.y, m.lh);
  }
}
function draw(now) {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  if (skin === 'excel') drawExcelGame(layoutBox(), now); else drawVSCodeGame(layoutBox(), now);
}

// ---------- 输入 ----------
const DIRS = {
  ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
};
function onKey(e) {
  if (e.key === 'Escape') { e.preventDefault(); toggleBoss(); return; }
  if (e.key === 'F2') { e.preventDefault(); setSkin(skin === 'excel' ? 'vscode' : 'excel'); return; }
  if (e.code === 'KeyM') { muted = !muted; if (!muted) ensureAudio(); return; }
  const d = DIRS[e.code] || DIRS[e.key];
  if (d) { e.preventDefault(); act(d[0], d[1]); return; }
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (boss) return;
    if (g.state === 'over') reset(); else act();
  }
}
window.addEventListener('keydown', onKey);
window.addEventListener('blur', () => { swipe = null; if (g.state === 'play') paused = true; });
// 触摸：滑过 24 px 就转向（不用等抬手），之后从当前位置继续算；没滑动的轻点 = 空格。
let swipe = null;
canvas.addEventListener('pointerdown', e => { swipe = { x: e.clientX, y: e.clientY, moved: false }; });
canvas.addEventListener('pointermove', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) act(Math.sign(dx), 0); else act(0, Math.sign(dy));
  swipe = { x: e.clientX, y: e.clientY, moved: true };
});
canvas.addEventListener('pointerup', () => {
  if (!swipe) return;
  const tap = !swipe.moved;
  swipe = null;
  if (!tap || boss) return;
  if (g.state === 'over') reset(); else act();
});
canvas.addEventListener('pointercancel', () => { swipe = null; });

// ---------- 启动 ----------
window.addEventListener('resize', resize);
resize();
reset();
document.title = SKINS[skin].title;
let lastT = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0);
  lastT = now;
  update(dt); draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// 主站在水合后才监听消息，单发的 ready 可能丢；重复的 ready 主站会忽略。每次 ready 后都跟一条 disguise。
function announce() {
  emitMoYuFunEvent('ready');
  emitMoYuFunDisguise(SKINS[skin].app, SKINS[skin].title);
}
announce();
for (const ms of [500, 2000, 5000]) setTimeout(announce, ms);
</script>
